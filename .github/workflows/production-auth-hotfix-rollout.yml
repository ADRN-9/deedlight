name: Production Auth Hotfix Rollout

on:
  push:
    branches:
      - production-canary
    paths:
      - .github/workflows/production-auth-hotfix-rollout.yml

permissions:
  contents: read

jobs:
  rollout:
    name: Apply and verify migration 022 in Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7

      - name: Guard project identity and exact migration blob
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || { echo "::error::SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" == "xaipiovflxomcbfwtwmu" ]] || { echo "::error::Unexpected Production project ref"; exit 1; }
          blob=$(git hash-object supabase/migrations/202609240022_auth_pgcrypto_schema_qualification.sql)
          [[ "$blob" == "f42afb3474f80c7d95cf5b47023b82cf5a948d4d" ]] || { echo "::error::Migration 022 blob does not match reviewed SQL"; exit 1; }
          echo "Production identity and reviewed migration 022 blob verified."

      - name: Verify exact broken Production baseline read-only
        shell: bash
        run: |
          set -euo pipefail
          query=$(cat <<'SQL'
          select
            to_regprocedure('extensions.gen_random_bytes(integer)') is not null as has_pgcrypto,
            position('extensions.gen_random_bytes(8)' in pg_get_functiondef('public.handle_new_user()'::regprocedure)) = 0 as not_yet_qualified,
            position('gen_random_bytes(8)' in pg_get_functiondef('public.handle_new_user()'::regprocedure)) > 0 as has_crypto_call,
            (select p.prosecdef from pg_proc p where p.oid = 'public.handle_new_user()'::regprocedure) as security_definer,
            coalesce((select array_to_string(p.proconfig, ',') from pg_proc p where p.oid = 'public.handle_new_user()'::regprocedure), '') like '%search_path=public, auth%' as function_search_path_ok,
            coalesce((select array_to_string(r.rolconfig, ',') from pg_roles r where r.rolname = 'supabase_auth_admin'), '') like '%search_path=auth%' as auth_role_search_path_ok,
            exists (
              select 1
              from pg_trigger t
              join pg_class c on c.oid = t.tgrelid
              join pg_namespace n on n.oid = c.relnamespace
              where not t.tgisinternal
                and n.nspname = 'auth'
                and c.relname = 'users'
                and t.tgname = 'on_auth_user_created'
                and t.tgfoid = 'public.handle_new_user()'::regprocedure
            ) as trigger_ok;
          SQL
          )
          jq -n --arg query "$query" '{query:$query}' >/tmp/preflight.json
          status=$(curl --silent --show-error --output /tmp/preflight-result.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
            --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' --data-binary @/tmp/preflight.json)
          [[ "$status" == "201" ]] || { echo "::error::Production Auth preflight returned HTTP $status"; exit 1; }
          jq -e '
            (if type == "array" then .[0] elif has("result") then .result[0] else . end) as $r
            | ($r.has_pgcrypto == true)
              and ($r.not_yet_qualified == true)
              and ($r.has_crypto_call == true)
              and ($r.security_definer == true)
              and ($r.function_search_path_ok == true)
              and ($r.auth_role_search_path_ok == true)
              and ($r.trigger_ok == true)
          ' /tmp/preflight-result.json >/dev/null || {
            echo "::error::Production does not match the exact reviewed broken Auth baseline; refusing mutation"
            jq -c 'if type == "array" then .[0] elif has("result") then .result[0] else . end' /tmp/preflight-result.json
            exit 1
          }
          echo "Exact broken Auth baseline verified; migration 022 is not yet applied."

      - name: Verify database-write API without mutation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"query":"select 1 as ok;","read_only":true}' >/tmp/write-probe.json
          status=$(curl --silent --show-error --output /tmp/write-probe-result.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' --data-binary @/tmp/write-probe.json)
          [[ "$status" == "201" ]] || { echo "::error::Database-write API permission probe returned HTTP $status"; exit 1; }
          echo "Database-write API permission verified without mutation."

      - name: Apply migration 022 exactly
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{query:.}' supabase/migrations/202609240022_auth_pgcrypto_schema_qualification.sql >/tmp/m022.json
          status=$(curl --silent --show-error --output /tmp/m022-result.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' --data-binary @/tmp/m022.json)
          if [[ "$status" != "201" ]]; then
            echo "::error::Migration 022 failed with HTTP $status"
            jq -c '{error:(.error // .message // "database mutation failed")}' /tmp/m022-result.json 2>/dev/null || true
            exit 1
          fi
          echo "Migration 022 applied."

      - name: Verify repaired Production Auth function and unchanged platform role
        shell: bash
        run: |
          set -euo pipefail
          query=$(cat <<'SQL'
          select
            position('extensions.gen_random_bytes(8)' in pg_get_functiondef('public.handle_new_user()'::regprocedure)) > 0 as qualified,
            (select p.prosecdef from pg_proc p where p.oid = 'public.handle_new_user()'::regprocedure) as security_definer,
            coalesce((select array_to_string(p.proconfig, ',') from pg_proc p where p.oid = 'public.handle_new_user()'::regprocedure), '') like '%search_path=public, auth%' as function_search_path_ok,
            coalesce((select array_to_string(r.rolconfig, ',') from pg_roles r where r.rolname = 'supabase_auth_admin'), '') like '%search_path=auth%' as auth_role_search_path_ok,
            coalesce(has_schema_privilege('supabase_auth_admin', 'extensions', 'USAGE'), false) = false as auth_extensions_usage_unchanged,
            exists (
              select 1
              from pg_trigger t
              join pg_class c on c.oid = t.tgrelid
              join pg_namespace n on n.oid = c.relnamespace
              where not t.tgisinternal
                and n.nspname = 'auth'
                and c.relname = 'users'
                and t.tgname = 'on_auth_user_created'
                and t.tgfoid = 'public.handle_new_user()'::regprocedure
            ) as trigger_ok;
          SQL
          )
          jq -n --arg query "$query" '{query:$query}' >/tmp/postverify.json
          status=$(curl --silent --show-error --output /tmp/postverify-result.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
            --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' --data-binary @/tmp/postverify.json)
          [[ "$status" == "201" ]] || { echo "::error::Migration 022 verification returned HTTP $status"; exit 1; }
          jq -e '
            (if type == "array" then .[0] elif has("result") then .result[0] else . end) as $r
            | ($r.qualified == true)
              and ($r.security_definer == true)
              and ($r.function_search_path_ok == true)
              and ($r.auth_role_search_path_ok == true)
              and ($r.auth_extensions_usage_unchanged == true)
              and ($r.trigger_ok == true)
          ' /tmp/postverify-result.json >/dev/null || {
            echo "::error::Production Auth function verification failed after migration 022"
            jq -c 'if type == "array" then .[0] elif has("result") then .result[0] else . end' /tmp/postverify-result.json
            exit 1
          }
          jq -c 'if type == "array" then .[0] elif has("result") then .result[0] else . end' /tmp/postverify-result.json
          echo "Production Auth pgcrypto schema qualification verified; Supabase Auth role boundary unchanged."
