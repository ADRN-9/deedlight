name: Production Canary Preflight

on:
  push:
    branches:
      - production-canary
    paths:
      - .github/workflows/production-canary-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    name: Verify approved canary and runtime credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Guard Production identity and credential presence
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || { echo "::error::SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" == "xaipiovflxomcbfwtwmu" ]] || { echo "::error::Unexpected Supabase Production project"; exit 1; }
          missing=0
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing from GitHub Actions"; missing=1; }
          [[ -n "${RESEND_API_KEY:-}" ]] || { echo "::error::RESEND_API_KEY is missing from GitHub Actions"; missing=1; }
          [[ "$missing" == 0 ]] || exit 1
          echo "Required Production credential names are present; values were not printed."

      - name: Verify only approved canary account consent state
        shell: bash
        run: |
          set -euo pipefail
          query=$(cat <<'SQL'
          with target as (
            select u.id, (u.email_confirmed_at is not null) as email_confirmed
            from auth.users u
            where md5(lower(coalesce(u.email, ''))) = 'a7e6edf4263513e268d1909951eeb35a'
          )
          select
            ((select count(*) from target) = 1) as account_exists_once,
            coalesce((select email_confirmed from target limit 1), false) as email_confirmed,
            coalesce((select not p.is_suspended from public.profiles p join target t on t.id = p.user_id limit 1), false) as profile_active,
            coalesce((select drp.daily_enabled from public.daily_reminder_preferences drp join target t on t.id = drp.user_id limit 1), false) as daily_enabled,
            coalesce((select (np.weekly_enabled and np.consented_at is not null and np.unsubscribed_at is null) from public.newsletter_preferences np join target t on t.id = np.user_id limit 1), false) as weekly_enabled;
          SQL
          )
          jq -n --arg query "$query" '{query:$query}' >/tmp/canary-preflight.json
          status=$(curl --silent --show-error --output /tmp/canary-preflight-result.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/canary-preflight.json)
          [[ "$status" == "201" ]] || { echo "::error::Canary consent query returned HTTP $status"; exit 1; }
          jq -c 'if type == "array" then .[0] elif has("result") then .result[0] else . end' /tmp/canary-preflight-result.json
          jq -e '
            (if type == "array" then .[0] elif has("result") then .result[0] else . end) as $r
            | ($r.account_exists_once == true)
              and ($r.email_confirmed == true)
              and ($r.profile_active == true)
              and (($r.daily_enabled == true) or ($r.weekly_enabled == true))
          ' /tmp/canary-preflight-result.json >/dev/null || {
            echo "::error::Approved canary is not uniquely present, confirmed, active, and opted into at least one delivery channel"
            exit 1
          }
          echo "Approved canary is uniquely present, confirmed, active, and opted in."
