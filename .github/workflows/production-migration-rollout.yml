name: Production Delivery Migration Rollout

on:
  push:
    branches:
      - gentle-delivery-transport
    paths:
      - .github/workflows/production-migration-rollout.yml

permissions:
  contents: read

concurrency:
  group: deedlight-production-migration
  cancel-in-progress: false

jobs:
  rollout:
    name: Apply production delivery migrations 020 and 021
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7

      - name: Guard project identity and exact migration blobs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || { echo "::error::SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" == "xaipiovflxomcbfwtwmu" ]] || { echo "::error::Unexpected production project ref"; exit 1; }

          m020=$(git hash-object supabase/migrations/202609230020_delivery_reliability_hardening.sql)
          m021=$(git hash-object supabase/migrations/202609230021_gentle_delivery_transport.sql)
          [[ "$m020" == "554615da3d15fc4c0d395691103d3be5676856fa" ]] || { echo "::error::Migration 020 blob does not match reviewed SQL"; exit 1; }
          [[ "$m021" == "e50a06bd3a5ed386c54e789435c64b2bb4a54ab9" ]] || { echo "::error::Migration 021 blob does not match reviewed SQL"; exit 1; }
          echo "Project identity and migration blobs verified."

      - name: Verify migration-019 live baseline read-only
        shell: bash
        run: |
          set -euo pipefail
          query=$(cat <<'SQL'
          select
            exists (
              select 1 from pg_catalog.pg_class c
              join pg_catalog.pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and c.relname = 'delivery_ledger' and c.relkind in ('r','p')
            ) as has_delivery_ledger,
            (
              select count(distinct p.proname) from pg_catalog.pg_proc p
              join pg_catalog.pg_namespace n on n.oid = p.pronamespace
              where n.nspname = 'public'
                and p.proname = any(array[
                  'enqueue_due_daily_reminders','enqueue_weekly_goodness_delivery','claim_delivery_jobs',
                  'authorize_delivery_job','mark_delivery_sent','mark_delivery_failed'
                ]::text[])
            ) as foundation_functions,
            (
              select count(*) from information_schema.columns c
              where c.table_schema = 'public' and c.table_name = 'delivery_ledger'
                and c.column_name = any(array['claim_expires_at','attempt_count','last_attempt_at','next_attempt_at']::text[])
            ) as reliability_columns,
            (
              select count(*) from information_schema.columns c
              where c.table_schema = 'public' and c.table_name = 'delivery_ledger' and c.column_name = 'transport_started_at'
            ) as transport_columns;
          SQL
          )
          jq -n --arg query "$query" '{query:$query}' >/tmp/preflight.json
          status=$(curl --silent --show-error --output /tmp/preflight-result.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
            --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' --data-binary @/tmp/preflight.json)
          [[ "$status" == "201" ]] || { echo "::error::Live baseline query returned HTTP $status"; exit 1; }
          jq -e '
            (if type == "array" then .[0] elif has("result") then .result[0] else . end) as $r
            | ($r.has_delivery_ledger == true)
              and (($r.foundation_functions|tonumber) == 6)
              and (($r.reliability_columns|tonumber) == 0)
              and (($r.transport_columns|tonumber) == 0)
          ' /tmp/preflight-result.json >/dev/null || { echo "::error::Production is not on the expected 019 delivery baseline"; exit 1; }
          echo "Migration-019 live baseline verified; 020/021 are absent."

      - name: Verify database-write API without mutation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"query":"select 1 as ok;","read_only":true}' >/tmp/write-probe.json
          status=$(curl --silent --show-error --output /tmp/write-probe-result.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' --data-binary @/tmp/write-probe.json)
          [[ "$status" == "201" ]] || { echo "::error::Database-write API permission probe returned HTTP $status"; exit 1; }
          echo "Database-write API permission verified without mutation."

      - name: Apply migration 020 exactly
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{query:.}' supabase/migrations/202609230020_delivery_reliability_hardening.sql >/tmp/m020.json
          status=$(curl --silent --show-error --output /tmp/m020-result.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' --data-binary @/tmp/m020.json)
          if [[ "$status" != "201" ]]; then
            echo "::error::Migration 020 failed with HTTP $status"
            cat /tmp/m020-result.json
            exit 1
          fi
          echo "Migration 020 applied."

      - name: Verify migration 020 before 021
        shell: bash
        run: |
          set -euo pipefail
          query=$(cat <<'SQL'
          select
            (
              select count(*) from information_schema.columns c
              where c.table_schema = 'public' and c.table_name = 'delivery_ledger'
                and c.column_name = any(array['claim_expires_at','attempt_count','last_attempt_at','next_attempt_at']::text[])
            ) as reliability_columns,
            to_regprocedure('public.retry_delivery_job(uuid,uuid,timestamp with time zone,text)') is not null as has_retry_rpc,
            (
              select count(*) from information_schema.columns c
              where c.table_schema = 'public' and c.table_name = 'delivery_ledger' and c.column_name = 'transport_started_at'
            ) as transport_columns;
          SQL
          )
          jq -n --arg query "$query" '{query:$query}' >/tmp/verify020.json
          status=$(curl --silent --show-error --output /tmp/verify020-result.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
            --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' --data-binary @/tmp/verify020.json)
          [[ "$status" == "201" ]] || { echo "::error::Migration 020 verification returned HTTP $status"; exit 1; }
          jq -e '
            (if type == "array" then .[0] elif has("result") then .result[0] else . end) as $r
            | (($r.reliability_columns|tonumber) == 4)
              and ($r.has_retry_rpc == true)
              and (($r.transport_columns|tonumber) == 0)
          ' /tmp/verify020-result.json >/dev/null || { echo "::error::Migration 020 verification failed; migration 021 will not run"; exit 1; }
          echo "Migration 020 verified; migration 021 remains absent."

      - name: Apply migration 021 exactly
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{query:.}' supabase/migrations/202609230021_gentle_delivery_transport.sql >/tmp/m021.json
          status=$(curl --silent --show-error --output /tmp/m021-result.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' --data-binary @/tmp/m021.json)
          if [[ "$status" != "201" ]]; then
            echo "::error::Migration 021 failed with HTTP $status"
            cat /tmp/m021-result.json
            exit 1
          fi
          echo "Migration 021 applied."

      - name: Verify final production delivery schema
        shell: bash
        run: |
          set -euo pipefail
          query=$(cat <<'SQL'
          select
            (
              select count(*) from information_schema.columns c
              where c.table_schema = 'public' and c.table_name = 'delivery_ledger'
                and c.column_name = any(array['claim_expires_at','attempt_count','last_attempt_at','next_attempt_at']::text[])
            ) as reliability_columns,
            (
              select count(*) from information_schema.columns c
              where c.table_schema = 'public' and c.table_name = 'delivery_ledger' and c.column_name = 'transport_started_at'
            ) as transport_columns,
            to_regprocedure('public.retry_delivery_job(uuid,uuid,timestamp with time zone,text)') is not null as has_retry_rpc,
            to_regprocedure('public.begin_delivery_transport(uuid,uuid)') is not null as has_begin_transport_rpc,
            to_regprocedure('public.enqueue_current_weekly_goodness_if_curated(timestamp with time zone,integer)') is not null as has_weekly_helper_rpc;
          SQL
          )
          jq -n --arg query "$query" '{query:$query}' >/tmp/final.json
          status=$(curl --silent --show-error --output /tmp/final-result.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
            --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' --data-binary @/tmp/final.json)
          [[ "$status" == "201" ]] || { echo "::error::Final schema verification returned HTTP $status"; exit 1; }
          cat /tmp/final-result.json
          jq -e '
            (if type == "array" then .[0] elif has("result") then .result[0] else . end) as $r
            | (($r.reliability_columns|tonumber) == 4)
              and (($r.transport_columns|tonumber) == 1)
              and ($r.has_retry_rpc == true)
              and ($r.has_begin_transport_rpc == true)
              and ($r.has_weekly_helper_rpc == true)
          ' /tmp/final-result.json >/dev/null || { echo "::error::Final Production delivery schema verification failed"; exit 1; }
          echo "Production migrations 020 and 021 are verified from the live schema."
