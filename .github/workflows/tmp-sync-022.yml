name: Temporary Sync Migration 022 Aggregate

on:
  push:
    branches:
      - production-canary
    paths:
      - .github/workflows/tmp-sync-022.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: production-canary

      - name: Append canonical migration 022 exactly once
        shell: bash
        run: |
          set -euo pipefail
          migration='supabase/migrations/202609240022_auth_pgcrypto_schema_qualification.sql'
          aggregate='supabase/run_in_sql_editor_all.sql'
          if grep -Fq 'Production Auth hotfix — schema-qualify pgcrypto' "$aggregate"; then
            echo 'Migration 022 is already present in aggregate SQL.'
            exit 0
          fi
          printf '\n\n' >> "$aggregate"
          cat "$migration" >> "$aggregate"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$aggregate"
          git commit -m 'db: sync auth pgcrypto hotfix aggregate'
          git push origin HEAD:production-canary
