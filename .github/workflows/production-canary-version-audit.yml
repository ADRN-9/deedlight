name: Production Canary Version Audit

on:
  push:
    branches:
      - production-canary
    paths:
      - .github/workflows/production-canary-version-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_AUDIT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d2e826d7e5193ba8e9140533d1cc8a97
      WORKER_NAME: deedlight
    steps:
      - uses: actions/checkout@v7
      - name: Inspect current Production deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments"
          status=$(curl --silent --show-error --output /tmp/deployments.json --write-out '%{http_code}' \
            "$url" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          [[ "$status" == "200" ]] || { echo "::error::Deployments lookup returned HTTP $status"; exit 1; }
          jq -e '.success == true' /tmp/deployments.json >/dev/null
          jq -c '{latest: (.result.deployments[0] // .result[0] // null)}' /tmp/deployments.json | \
            jq -c '{created_on: .latest.created_on, source: .latest.source, versions: [.latest.versions[]? | {version_id: .version_id, percentage: .percentage}]}'
          rm -f /tmp/deployments.json
