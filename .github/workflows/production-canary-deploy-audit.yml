name: Production Canary Deploy Audit

on:
  push:
    branches:
      - production-canary
    paths:
      - .github/workflows/production-canary-deploy-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_AUDIT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d2e826d7e5193ba8e9140533d1cc8a97
      WORKER_NAME: deedlight
    steps:
      - uses: actions/checkout@v7
      - name: Guard audit credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::Cloudflare audit token is missing"; exit 1; }

      - name: Verify runtime remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          settings_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings"
          status=$(curl --silent --show-error --output /tmp/settings.json --write-out '%{http_code}' \
            "$settings_url" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          [[ "$status" == "200" ]] || { echo "::error::Worker settings lookup returned HTTP $status"; exit 1; }
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '[.result.bindings[] | select(.name == "DELIVERY_ENABLED" and .type == "plain_text" and .text == "false")] | length == 1' /tmp/settings.json >/dev/null || {
            echo "::error::DELIVERY_ENABLED is not exactly false"; exit 1;
          }
          jq -e '[.result.bindings[] | select(.name == "RESEND_API_KEY" and .type == "secret_text")] | length == 1' /tmp/settings.json >/dev/null || {
            echo "::error::RESEND_API_KEY secret is missing"; exit 1;
          }
          jq -e '[.result.bindings[] | select(.name == "SUPABASE_SERVICE_ROLE_KEY" and .type == "secret_text")] | length == 1' /tmp/settings.json >/dev/null || {
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is missing"; exit 1;
          }
          rm -f /tmp/settings.json
          echo "Production delivery remains globally disabled and runtime secrets are present."

      - name: Verify Cron remains empty
        shell: bash
        run: |
          set -euo pipefail
          schedules_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/schedules"
          status=$(curl --silent --show-error --output /tmp/schedules.json --write-out '%{http_code}' \
            "$schedules_url" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          [[ "$status" == "200" ]] || { echo "::error::Worker schedules lookup returned HTTP $status"; exit 1; }
          jq -e '.success == true and ((.result.schedules // []) | length == 0)' /tmp/schedules.json >/dev/null || {
            echo "::error::Production Cron is not empty"; exit 1;
          }
          rm -f /tmp/schedules.json
          echo "Production Cron trigger count is zero."

      - name: Verify temporary canary gate is deployed
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            status=$(curl --silent --show-error --output /tmp/body --write-out '%{http_code}' \
              https://deedlight.com/__ops/delivery-canary || true)
            if [[ "$status" == "405" ]] && jq -e '.error == "method_not_allowed"' /tmp/body >/dev/null 2>&1; then
              echo "Temporary canary gate is live and POST-only."
              exit 0
            fi
            echo "Canary gate not live yet (attempt $attempt, HTTP $status); waiting..."
            sleep 15
          done
          echo "::error::Temporary canary gate did not become live in time"
          exit 1
