name: PR Validation

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
      DELIVERY_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed on production configuration
        shell: bash
        run: |
          set -euo pipefail
          test "${NEXT_PUBLIC_SITE_URL}" != "https://deedlight.com"
          test "${DELIVERY_ENABLED}" = "false"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test -z "${RESEND_API_KEY:-}"
          test -z "${DELIVERY_FROM_EMAIL:-}"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diff integrity
        run: git diff --check

      - name: Fail closed on duplicated or missing required PR checks
        run: node scripts/verify-release-workflow-identities.mjs

      - name: Sprint 12.1 security assertions
        run: node scripts/verify-sprint12-1-security.mjs

      - name: Sprint 12.2 delivery security assertions
        run: node scripts/verify-sprint12-2-delivery-security.mjs

      - name: Delivery reliability security assertions
        run: node scripts/verify-delivery-reliability.mjs

      - name: Gentle delivery transport security assertions
        run: node scripts/verify-gentle-delivery-transport.mjs

      - name: Current-consent and migration-target security assertions
        run: node scripts/verify-delivery-consent-gates.mjs

      - name: Auth pgcrypto schema-qualification assertions
        run: node scripts/verify-auth-pgcrypto-schema-qualification.mjs

      - name: Gentle delivery transport behavior
        run: node --test scripts/test-delivery-transport.mjs

      - name: C144 migration 034 compatibility and duplicate-prefix guard
        run: node scripts/test-c144-migration-034-compatibility.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Next.js production build with non-production configuration
        run: npm run build

      - name: Cloudflare packaging build with non-production configuration
        run: npx opennextjs-cloudflare build

      - name: Fail closed on high or critical dependency advisories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence/validate
          npm audit --json --audit-level=high > release-evidence/validate/npm-audit.json
          node scripts/verify-dependency-audit.mjs release-evidence/validate/npm-audit.json \
            | tee release-evidence/validate/dependency-audit-summary.txt

      - name: Attest exact source for validate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p release-evidence/validate
          git rev-parse HEAD > release-evidence/validate/commit.txt
          git rev-parse HEAD^{tree} > release-evidence/validate/tree.txt
          printf 'PASS\n' > release-evidence/validate/result.txt
      - name: Record canonical per-job run and attempt provenance
        if: success()
        run: node scripts/write-release-evidence-receipt.mjs
      - name: Retain validate check receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence-validate-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          retention-days: 21
          if-no-files-found: error
          path: release-evidence/validate/

  sprint12_2_database_behavior:
