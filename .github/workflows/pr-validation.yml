      PGUSER: postgres
      PGPASSWORD: postgres
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Verify isolated source and reject Production configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$DELIVERY_ENABLED" = false
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for key in DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD SUPABASE_ACCESS_TOKEN RESEND_API_KEY RESEND_WEBHOOK_SECRET CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -z "$(printenv "$key" || true)"
          done
          mkdir -p release-evidence/release_webhook_http
          git rev-parse HEAD > release-evidence/release_webhook_http/commit.txt
          git rev-parse HEAD^{tree} > release-evidence/release_webhook_http/tree.txt
      - name: Install disposable PostgreSQL client and locked Node dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y postgresql-client
          npm ci
      - name: Signed webhooks, provider contract and real synthetic HTTP routing
        shell: bash
        run: |
          set -euo pipefail
          set +x
          out=release-evidence/release_webhook_http
          node --test scripts/test-c73-provider-webhook.mjs > "$out/signed-webhooks.log" 2>&1
          node --test scripts/test-c76-provider-contract.mjs > "$out/provider-contract.log" 2>&1
          node scripts/verify-c73-security.mjs > "$out/source-contract.log" 2>&1
          createdb deedlight_c76_http
          psql -X -v ON_ERROR_STOP=1 -d deedlight_c76_http -f scripts/test-c73-integrated-provider-security.sql > "$out/http-019-030.log" 2>&1
          for file in supabase/migrations/202611130031_c74_legacy_lifecycle_guard.sql supabase/migrations/202611130032_c75_monotone_recipient_conflict_hold.sql supabase/migrations/202611130033_c76_provider_classification_and_suppression.sql; do
            psql -X -v ON_ERROR_STOP=1 -d deedlight_c76_http -f "$file" > "$out/$(basename "$file").log" 2>&1
          done
          node scripts/test-c76-route-http.mjs > "$out/route-http.log" 2>&1
          printf 'PASS\n' > "$out/result.txt"
      - name: Record canonical per-job run and attempt provenance
        if: success()
        run: node scripts/write-release-evidence-receipt.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-evidence-release_webhook_http-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: release-evidence/release_webhook_http/
          retention-days: 21
          if-no-files-found: error

  release_security_gate:
    if: ${{ always() }}
    needs:
      - validate
      - sprint12_2_database_behavior
      - delivery_reliability_database_behavior
      - gentle_delivery_transport_database_behavior
      - auth_pgcrypto_database_behavior
      - delivery_migration_order_database_behavior
      - release_privacy_pg16
      - release_action_privacy
      - release_provider_pg16
      - release_consent_races
      - release_webhook_http
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      EXPECTED_SHA: ${{ github.sha }}
      EXPECTED_RUN_ID: ${{ github.run_id }}
      EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
      EXPECTED_REPOSITORY: ${{ github.repository }}
      DELIVERY_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Verify checked-out source and capture Git tree
        shell: bash
        run: |
          set -euo pipefail
          test "$DELIVERY_ENABLED" = "false"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXPECTED_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - name: Fetch trusted current-attempt jobs and complete run artifact registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ADRN-9/deedlight"
          test "$DELIVERY_ENABLED" = "false"
          mkdir -p release-platform
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > release-platform/attempt.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > release-platform/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > release-platform/artifacts.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-evidence-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: release-downloaded/
      - name: Fail closed on missing, failed, skipped or cancelled jobs and invalid artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-security-gate.mjs
          node --test scripts/test-release-security-gate.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-security-gate-manifest-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: release-security-gate-manifest.json
          retention-days: 21
          if-no-files-found: error
