          --health-retries 10
      postgres_redirect:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deedlight_migration_order_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deedlight_migration_order_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      DEEDLIGHT_DISPOSABLE_FIXTURE_AUTHORIZATION: deedlight-postgres16-ci-disposable-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail closed on Production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${RESEND_API_KEY:-}"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run migration ordering positive and negative behavior
        run: bash scripts/test-delivery-migration-order.sh
      - name: Verify PostgreSQL service endpoint identities
        shell: bash
        run: |
          set -euo pipefail
          primary_service_id="${{ job.services.postgres.id }}"
          redirect_service_id="${{ job.services.postgres_redirect.id }}"
          primary_addr="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$primary_service_id")"
          redirect_addr="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$redirect_service_id")"
          [[ "$primary_addr" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]
          [[ "$redirect_addr" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]
          [[ "$primary_addr" != "$redirect_addr" ]]
          mapped_primary_addr="$(env -i PATH="$PATH" HOME="${HOME:-/tmp}" PGPASSWORD=postgres psql -X -h 127.0.0.1 -p 5432 -U postgres -d deedlight_migration_order_test -Atqc 'SELECT pg_catalog.host(pg_catalog.inet_server_addr())')"
          mapped_redirect_addr="$(env -i PATH="$PATH" HOME="${HOME:-/tmp}" PGPASSWORD=postgres psql -X -h 127.0.0.1 -p 5433 -U postgres -d deedlight_migration_order_test -Atqc 'SELECT pg_catalog.host(pg_catalog.inet_server_addr())')"
          [[ "$mapped_primary_addr" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]
          [[ "$mapped_redirect_addr" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]
          [[ "$mapped_primary_addr" != "$mapped_redirect_addr" ]]
          echo "PostgreSQL service containers: primary=$primary_addr redirect=$redirect_addr"
          echo "PostgreSQL mapped listeners: primary=$mapped_primary_addr redirect=$mapped_redirect_addr"
          echo "DEEDLIGHT_EXPECTED_SERVER_ADDR=$mapped_primary_addr" >> "$GITHUB_ENV"
          echo "DEEDLIGHT_REDIRECT_SERVER_ADDR=$mapped_redirect_addr" >> "$GITHUB_ENV"

      - name: Install pinned Supabase CLI for duplicate migration regression
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Verify duplicate 007 order and CLI migration semantics
        run: bash scripts/test-duplicate-migration-007.sh

      - name: Production migration audit PostgreSQL 16 behavior and interruption tests
        run: bash scripts/test-production-migration-readonly-audit-postgres16.sh
      - name: Preserve PostgreSQL 16 migration-audit diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-audit-postgres16-diagnostics
          path: ${{ runner.temp }}/deedlight-migration-audit-*
          if-no-files-found: ignore
          retention-days: 7

