      - name: Validate fail-closed Production owner manifest mechanics with fixture-only identities
        run: node --test scripts/test-production-function-owner-manifest.mjs

      - name: Verify signed Production owner approvals and evidence with ephemeral fixture keys
        run: node --test scripts/test-production-owner-approval-bundle.mjs

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute actual Query 8A and Query 8B against disposable PostgreSQL 16
        run: node scripts/test-security-definer-ownership-audit.mjs

