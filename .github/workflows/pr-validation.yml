  release_provider_pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DELIVERY_ENABLED: "false"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install disposable PostgreSQL 16 client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y postgresql-client
      - name: Exact-commit migrations 019–033, provider security and C77 post-033
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p release-evidence/release_provider_pg16
          test "$DELIVERY_ENABLED" = false
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > release-evidence/release_provider_pg16/commit.txt
          git rev-parse HEAD^{tree} > release-evidence/release_provider_pg16/tree.txt
          for key in DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD SUPABASE_ACCESS_TOKEN RESEND_API_KEY RESEND_WEBHOOK_SECRET CLOUDFLARE_API_TOKEN; do
            test -z "$(printenv "$key" || true)"
          done
          psql -X -At -v ON_ERROR_STOP=1 -d postgres -c 'show server_version;' > release-evidence/release_provider_pg16/version.txt
          provision() {
            local db="$1" prefix="$2"
            createdb "$db"
            psql -X -v ON_ERROR_STOP=1 -d "$db" -f scripts/test-c73-integrated-provider-security.sql > "release-evidence/release_provider_pg16/${prefix}-019-030.log" 2>&1
            psql -X -v ON_ERROR_STOP=1 -d "$db" -f supabase/migrations/202611130031_c74_legacy_lifecycle_guard.sql > "release-evidence/release_provider_pg16/${prefix}-031.log" 2>&1
            psql -X -v ON_ERROR_STOP=1 -d "$db" -f supabase/migrations/202611130032_c75_monotone_recipient_conflict_hold.sql > "release-evidence/release_provider_pg16/${prefix}-032.log" 2>&1
            psql -X -v ON_ERROR_STOP=1 -d "$db" -f supabase/migrations/202611130033_c76_provider_classification_and_suppression.sql > "release-evidence/release_provider_pg16/${prefix}-033.log" 2>&1
          }
          provision deedlight_c79_provider provider
          psql -X -v ON_ERROR_STOP=1 -d deedlight_c79_provider -f scripts/test-c76-provider-classification.sql > release-evidence/release_provider_pg16/provider-classification.log 2>&1
          provision deedlight_c79_post033 post033
          psql -X -v ON_ERROR_STOP=1 -d deedlight_c79_post033 -f scripts/test-c77-post033.sql > release-evidence/release_provider_pg16/c77-post033.log 2>&1
          echo "Synthetic 019–033 provider migration and post-033 tests PASS" | tee release-evidence/release_provider_pg16/provider-result.txt
          printf 'PASS\n' > release-evidence/release_provider_pg16/result.txt
      - name: Record canonical per-job run and attempt provenance
        if: success()
        run: node scripts/write-release-evidence-receipt.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-evidence-release_provider_pg16-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: release-evidence/release_provider_pg16/
          retention-days: 14
          if-no-files-found: error

