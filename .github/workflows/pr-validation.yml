  release_privacy_pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGOPTIONS: "-c search_path=public,extensions,pg_catalog"
      DELIVERY_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject Production configuration and verify source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$DELIVERY_ENABLED" = "false"
          test "$(git merge-base e7f0898b52e4e58b807d1c14a134684e740e5295 HEAD)" = "e7f0898b52e4e58b807d1c14a134684e740e5295"
          test "$(git merge-base 136e467927269196a97d028feb6f00987f30b257 HEAD)" = "136e467927269196a97d028feb6f00987f30b257"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f supabase/migrations/202611150034_c101_member_privacy_boundaries.sql
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 35
          mkdir -p release-evidence/release_privacy_pg16
          printf '%s\n' "$(git rev-parse HEAD)" > release-evidence/release_privacy_pg16/commit.txt
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > release-evidence/release_privacy_pg16/tree.txt
          for key in DATABASE_URL SUPABASE_URL SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY RESEND_WEBHOOK_SECRET; do
            test -z "$(printenv "$key" || true)"
          done
          test "$PGHOST" = "127.0.0.1"
          test "$PGPORT" = "5432"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install disposable PostgreSQL client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y postgresql-client
      - name: Bootstrap synthetic Supabase roles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence/release_privacy_pg16
          psql -X -At -v ON_ERROR_STOP=1 -c 'show server_version;' | tee release-evidence/release_privacy_pg16/postgres-version.txt
          psql -X -v ON_ERROR_STOP=1 -f scripts/c101-bootstrap.sql > release-evidence/release_privacy_pg16/bootstrap.log 2>&1
      - name: Install exact-source migration chain 001–034
        shell: bash
        run: |
          set -euo pipefail
          : > release-evidence/release_privacy_pg16/migrations.log
          while IFS= read -r file; do
            # Historical Sprint 6 migration seeds only an empty daily_posts.
            # Model an existing valid legacy Daily post, without altering DDL.
            if [[ "$file" == "supabase/migrations/202607260007_sprint6_daily_deedlight.sql" ]]; then
              psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO public.daily_posts (date,slug,title,reflection,daily_action,status) VALUES (current_date,'c83-legacy-seed','C83 existing Daily','Synthetic historical reflection','Synthetic historical action','published')" >> release-evidence/release_privacy_pg16/migrations.log 2>&1
            fi
            echo "APPLY $file" >> release-evidence/release_privacy_pg16/migrations.log
            if ! psql -X -v ON_ERROR_STOP=1 -f "$file" >> release-evidence/release_privacy_pg16/migrations.log 2>&1; then
              echo "::error::Disposable migration failure in $file"
              tail -n 35 release-evidence/release_privacy_pg16/migrations.log
              exit 1
            fi
          done < <(find supabase/migrations -maxdepth 1 -name '*.sql' -type f | LC_ALL=C sort)
          echo "ALL 001–034 source migrations applied to disposable database" | tee release-evidence/release_privacy_pg16/migration-summary.txt
      - name: Exercise real anon and authenticated privacy boundaries
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f scripts/test-c101-member-privacy.sql 2>&1 | tee release-evidence/release_privacy_pg16/privacy.log
          node scripts/verify-release-privacy-inventory.mjs release-evidence/release_privacy_pg16/privacy.log | tee release-evidence/release_privacy_pg16/inventory.txt
          printf 'PASS\n' > release-evidence/release_privacy_pg16/result.txt
      - name: Record canonical per-job run and attempt provenance
        if: success()
        run: node scripts/write-release-evidence-receipt.mjs
      - name: Preserve sanitized evidence on failure and success
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence-release_privacy_pg16-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 21
          path: release-evidence/release_privacy_pg16/

  release_action_privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DELIVERY_ENABLED: "false"
      ADMIN_EMAILS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and prohibit Production credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$DELIVERY_ENABLED" = "false"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base 8b097d5c5be264618558295cb57d8479390a89fa HEAD)" = "8b097d5c5be264618558295cb57d8479390a89fa"
          test "$(git merge-base 136e467927269196a97d028feb6f00987f30b257 HEAD)" = "136e467927269196a97d028feb6f00987f30b257"
          test -f scripts/test-c103-moderation-actions.mjs
          for key in DATABASE_URL SUPABASE_URL SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY RESEND_WEBHOOK_SECRET; do
            test -z "$(printenv "$key" || true)"
          done
          mkdir -p release-evidence/release_action_privacy
          git rev-parse HEAD > release-evidence/release_action_privacy/commit.txt
          git rev-parse HEAD^{tree} > release-evidence/release_action_privacy/tree.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Install exactly locked application dependencies
        run: npm ci
      - name: Exercise actual moderation server actions and rendered owner surfaces
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap scripts/test-c103-moderation-actions.mjs 2>&1 | tee release-evidence/release_action_privacy/app-privacy.log
          node scripts/verify-release-action-inventory.mjs release-evidence/release_action_privacy/app-privacy.log | tee release-evidence/release_action_privacy/inventory.txt
          printf 'PASS\n' > release-evidence/release_action_privacy/result.txt
      - name: Record canonical per-job run and attempt provenance
