name: PR Validation

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed on production configuration
        shell: bash
        run: |
          set -euo pipefail
          test "${NEXT_PUBLIC_SITE_URL}" != "https://deedlight.com"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diff integrity
        run: git diff --check

      - name: Sprint 12.1 security assertions
        run: node scripts/verify-sprint12-1-security.mjs

      - name: Sprint 12.2 delivery security assertions
        run: node scripts/verify-sprint12-2-delivery-security.mjs

      - name: Fail closed on high or critical dependency advisories
        run: npm audit --audit-level=high

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Next.js production build with non-production configuration
        run: npm run build

      - name: Cloudflare packaging build with non-production configuration
        run: npx opennextjs-cloudflare build

  sprint12_2_database_behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deedlight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deedlight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed on production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run Sprint 12.2 database behavior tests
        run: |
          psql \
            --host 127.0.0.1 \
            --port 5432 \
            --username postgres \
            --dbname deedlight_test \
            --file scripts/test-sprint12-2-delivery.sql
