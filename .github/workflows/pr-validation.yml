      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail closed on Production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test -z "${RESEND_API_KEY:-}"
          test -z "${DEEDLIGHT_COLLECTOR_ENDPOINT_PROFILE_SHA256:-}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install disposable PostgreSQL client and certificate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client openssl jq

      - name: Identify disposable PostgreSQL service containers
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ job.services.postgres.id }}"
          test -n "${{ job.services.postgres_redirect.id }}"
          echo "DEEDLIGHT_POSTGRES_CONTAINER_ID=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"
          echo "DEEDLIGHT_POSTGRES_REDIRECT_CONTAINER_ID=${{ job.services.postgres_redirect.id }}" >> "$GITHUB_ENV"

      - name: Run disposable PostgreSQL 16 collector and local TLS integration
        run: bash scripts/test-production-evidence-collector-postgres16.sh
