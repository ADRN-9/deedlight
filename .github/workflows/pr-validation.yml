name: PR Validation

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main, 'feat/**', 'docs/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
      DELIVERY_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail closed on production configuration
        shell: bash
        run: |
          set -euo pipefail
          test "${NEXT_PUBLIC_SITE_URL}" != "https://deedlight.com"
          test "${DELIVERY_ENABLED}" = "false"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test -z "${RESEND_API_KEY:-}"
          test -z "${RESEND_WEBHOOK_SECRET:-}"
          test -z "${DELIVERY_FROM_EMAIL:-}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency remediation assertions
        run: node scripts/verify-dependency-remediation.mjs

      - name: Diff integrity
        run: git diff --check

      - name: Verify pinned migration inventory and SQL Editor aggregate
        run: node scripts/verify-migration-inventory-aggregate.mjs

      - name: Migration inventory and aggregate negative fixtures
        run: node --test scripts/test-migration-inventory-aggregate.mjs

      - name: Production migration audit SQL static safety regressions
        run: node --test scripts/test-production-migration-readonly-audit.mjs

      - name: Verify C556 source-derived migration effect observations
        run: node scripts/verify-c556-migration-source-observations.mjs

      - name: Verify C574 exact-source semantic mapping inventory
        run: npm run verify:c574-source-map

      - name: C574 source mapping and literal distinction regressions
        run: npm run test:c574-source-map

      - name: Category-specific migration effect contract tests
        run: node --test scripts/test-migration-effect-contracts.mjs

      - name: Migration reconciliation analyzer adversarial security regressions
        run: node --test scripts/test-reconcile-migration-evidence.mjs

      - name: Production evidence collector unit and adversarial tests
        run: node --test scripts/test-production-evidence-collector.mjs

      - name: Collector-to-analyzer adapter adversarial tests
        run: node --test scripts/test-production-evidence-adapter.mjs

      - name: Offline evidence package integrity and tamper tests
        run: node --test scripts/test-evidence-package-integrity.mjs



      - name: Sprint 12.1 security assertions
        run: node scripts/verify-sprint12-1-security.mjs

      - name: Sprint 12.2 delivery security assertions
        run: node scripts/verify-sprint12-2-delivery-security.mjs

      - name: Delivery reliability security assertions
        run: node scripts/verify-delivery-reliability.mjs

      - name: Daily and Weekly claim isolation security assertions
        run: node scripts/verify-delivery-kind-claims.mjs

      - name: Gentle delivery transport security assertions
        run: node scripts/verify-gentle-delivery-transport.mjs

      - name: Current-consent and migration-target security assertions
        run: node scripts/verify-delivery-consent-gates.mjs

      - name: Resend provider webhook security assertions
        run: node scripts/verify-delivery-provider-webhooks.mjs

      - name: ESLint changed delivery security files
        run: >-
          npx eslint
          lib/delivery/resend-webhook.ts
          scripts/test-delivery-webhook.mjs
          scripts/verify-delivery-reliability.mjs
          scripts/verify-delivery-provider-webhooks.mjs
          app/admin/provider-integrity/page.tsx
          app/admin/provider-integrity/actions.ts
          'app/admin/provider-integrity/[conflictId]/page.tsx'

      - name: Auth pgcrypto schema-qualification assertions
        run: node scripts/verify-auth-pgcrypto-schema-qualification.mjs

      - name: Gentle delivery transport behavior
        run: node --test scripts/test-delivery-transport.mjs

      - name: Resend provider webhook behavior
        run: npm run test:delivery-webhook

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Next.js production build with non-production configuration
        run: npm run build

      - name: Cloudflare packaging build with non-production configuration
        run: npx opennextjs-cloudflare build

      - name: Fail closed on moderate or higher dependency advisories
        run: npm audit --audit-level=moderate

  sprint12_2_database_behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deedlight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deedlight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
