name: Sprint 12.2 Production Migration

on:
  push:
    branches: [sprint-12-2-gentle-delivery-foundation]
    paths:
      - .github/workflows/sprint12-2-production-migration.yml

permissions:
  contents: read

jobs:
  migrate_and_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_LANDING_AUDIT_TOKEN: ${{ secrets.SUPABASE_LANDING_AUDIT_TOKEN }}
      SUPABASE_PROJECT_REF: xaipiovflxomcbfwtwmu
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: sprint-12-2-gentle-delivery-foundation
          fetch-depth: 0

      - name: Fail closed on target and scoped credential
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'sprint-12-2-gentle-delivery-foundation'
          test -n "${SUPABASE_LANDING_AUDIT_TOKEN:-}"
          test "${SUPABASE_PROJECT_REF}" = 'xaipiovflxomcbfwtwmu'
          test -f supabase/migrations/202609230019_sprint12_2_gentle_delivery_foundation.sql

      - name: Guard production baseline
        shell: bash
        run: |
          set -euo pipefail
          read -r -d '' QUERY <<'SQL' || true
          select jsonb_build_object(
            'current_user', current_user,
            'migration_relation', to_regclass('supabase_migrations.schema_migrations')::text,
            'remove_rpc_exists', to_regprocedure('public.remove_own_offering(uuid)') is not null,
            'ledger_exists', to_regclass('public.delivery_ledger') is not null,
            'reminder_rpc_exists', to_regprocedure('public.set_daily_reminder_preference(boolean,time without time zone,text)') is not null
          ) as result;
          SQL
          payload="$(jq -n --arg query "${QUERY}" '{query:$query}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_LANDING_AUDIT_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "${payload}")"
          printf '%s\n' "${response}" | jq .
          result="$(printf '%s\n' "${response}" | jq -c '.[0].result')"
          test "$(printf '%s' "${result}" | jq -r '.current_user')" = 'postgres'
          test "$(printf '%s' "${result}" | jq -r '.migration_relation')" = 'null'
          test "$(printf '%s' "${result}" | jq -r '.remove_rpc_exists')" = 'true'

          ledger="$(printf '%s' "${result}" | jq -r '.ledger_exists')"
          reminder="$(printf '%s' "${result}" | jq -r '.reminder_rpc_exists')"
          if [ "${ledger}" = 'false' ] && [ "${reminder}" = 'false' ]; then
            echo 'APPLY_MIGRATION=1' >> "${GITHUB_ENV}"
          elif [ "${ledger}" = 'true' ] && [ "${reminder}" = 'true' ]; then
            echo 'APPLY_MIGRATION=0' >> "${GITHUB_ENV}"
          else
            echo 'Refusing mutation: production is in a partially-applied Sprint 12.2 state.' >&2
            exit 1
          fi

      - name: Apply exact migration 019
        shell: bash
        run: |
          set -euo pipefail
          if [ "${APPLY_MIGRATION}" != '1' ]; then
            echo 'Migration 019 already appears installed; skipping mutation and continuing verification.'
            exit 0
          fi

          migration="$(cat supabase/migrations/202609230019_sprint12_2_gentle_delivery_foundation.sql)"
          payload="$(jq -n --arg query "${migration}" '{query:$query}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_LANDING_AUDIT_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "${payload}")"
          printf '%s\n' "${response}" | jq .

      - name: Verify production schema and privileges
        shell: bash
        run: |
          set -euo pipefail
          read -r -d '' QUERY <<'SQL' || true
          select jsonb_build_object(
            'ledger_exists', to_regclass('public.delivery_ledger') is not null,
            'ledger_rls', (
              select c.relrowsecurity
              from pg_catalog.pg_class c
              where c.oid = to_regclass('public.delivery_ledger')
            ),
            'ledger_rows', (select count(*) from public.delivery_ledger),
            'anon_ledger_select', has_table_privilege('anon', 'public.delivery_ledger', 'select'),
            'anon_ledger_insert', has_table_privilege('anon', 'public.delivery_ledger', 'insert'),
            'authenticated_ledger_select', has_table_privilege('authenticated', 'public.delivery_ledger', 'select'),
            'authenticated_ledger_insert', has_table_privilege('authenticated', 'public.delivery_ledger', 'insert'),
            'authenticated_ledger_update', has_table_privilege('authenticated', 'public.delivery_ledger', 'update'),
            'authenticated_ledger_delete', has_table_privilege('authenticated', 'public.delivery_ledger', 'delete'),
            'service_role_ledger_select', has_table_privilege('service_role', 'public.delivery_ledger', 'select'),
            'service_role_ledger_insert', has_table_privilege('service_role', 'public.delivery_ledger', 'insert'),
            'service_role_ledger_update', has_table_privilege('service_role', 'public.delivery_ledger', 'update'),
            'service_role_ledger_delete', has_table_privilege('service_role', 'public.delivery_ledger', 'delete'),
            'authenticated_direct_reminder_insert', has_table_privilege('authenticated', 'public.daily_reminder_preferences', 'insert'),
            'authenticated_direct_reminder_update', has_table_privilege('authenticated', 'public.daily_reminder_preferences', 'update'),
            'authenticated_reminder_rpc', has_function_privilege('authenticated', 'public.set_daily_reminder_preference(boolean,time without time zone,text)', 'execute'),
            'anon_reminder_rpc', has_function_privilege('anon', 'public.set_daily_reminder_preference(boolean,time without time zone,text)', 'execute'),
            'authenticated_enqueue_daily', has_function_privilege('authenticated', 'public.enqueue_due_daily_reminders(timestamp with time zone,integer)', 'execute'),
            'authenticated_enqueue_weekly', has_function_privilege('authenticated', 'public.enqueue_weekly_goodness_delivery(date,timestamp with time zone,integer)', 'execute'),
            'authenticated_claim', has_function_privilege('authenticated', 'public.claim_delivery_jobs(timestamp with time zone,integer)', 'execute'),
            'authenticated_authorize', has_function_privilege('authenticated', 'public.authorize_delivery_job(uuid,uuid)', 'execute'),
            'service_role_enqueue_daily', has_function_privilege('service_role', 'public.enqueue_due_daily_reminders(timestamp with time zone,integer)', 'execute'),
            'service_role_enqueue_weekly', has_function_privilege('service_role', 'public.enqueue_weekly_goodness_delivery(date,timestamp with time zone,integer)', 'execute'),
            'service_role_claim', has_function_privilege('service_role', 'public.claim_delivery_jobs(timestamp with time zone,integer)', 'execute'),
            'service_role_authorize', has_function_privilege('service_role', 'public.authorize_delivery_job(uuid,uuid)', 'execute'),
            'reminder_rpc_security_definer', (
              select p.prosecdef
              from pg_catalog.pg_proc p
              where p.oid = 'public.set_daily_reminder_preference(boolean,time without time zone,text)'::regprocedure
            ),
            'authorize_rpc_security_definer', (
              select p.prosecdef
              from pg_catalog.pg_proc p
              where p.oid = 'public.authorize_delivery_job(uuid,uuid)'::regprocedure
            )
          ) as result;
          SQL
          payload="$(jq -n --arg query "${QUERY}" '{query:$query}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_LANDING_AUDIT_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "${payload}")"
          printf '%s\n' "${response}" | jq .
          result="$(printf '%s\n' "${response}" | jq -c '.[0].result')"

          test "$(printf '%s' "${result}" | jq -r '.ledger_exists')" = 'true'
          test "$(printf '%s' "${result}" | jq -r '.ledger_rls')" = 'true'
          test "$(printf '%s' "${result}" | jq -r '.ledger_rows')" = '0'
          test "$(printf '%s' "${result}" | jq -r '.anon_ledger_select')" = 'false'
          test "$(printf '%s' "${result}" | jq -r '.anon_ledger_insert')" = 'false'
          test "$(printf '%s' "${result}" | jq -r '.authenticated_ledger_select')" = 'false'
          test "$(printf '%s' "${result}" | jq -r '.authenticated_ledger_insert')" = 'false'
          test "$(printf '%s' "${result}" | jq -r '.authenticated_ledger_update')" = 'false'
          test "$(printf '%s' "${result}" | jq -r '.authenticated_ledger_delete')" = 'false'
          test "$(printf '%s' "${result}" | jq -r '.service_role_ledger_select')" = 'true'
          test "$(printf '%s' "${result}" | jq -r '.service_role_ledger_insert')" = 'true'
          test "$(printf '%s' "${result}" | jq -r '.service_role_ledger_update')" = 'true'
          test "$(printf '%s' "${result}" | jq -r '.service_role_ledger_delete')" = 'true'
          test "$(printf '%s' "${result}" | jq -r '.authenticated_direct_reminder_insert')" = 'false'
          test "$(printf '%s' "${result}" | jq -r '.authenticated_direct_reminder_update')" = 'false'
          test "$(printf '%s' "${result}" | jq -r '.authenticated_reminder_rpc')" = 'true'
          test "$(printf '%s' "${result}" | jq -r '.anon_reminder_rpc')" = 'false'
          test "$(printf '%s' "${result}" | jq -r '.authenticated_enqueue_daily')" = 'false'
          test "$(printf '%s' "${result}" | jq -r '.authenticated_enqueue_weekly')" = 'false'
          test "$(printf '%s' "${result}" | jq -r '.authenticated_claim')" = 'false'
          test "$(printf '%s' "${result}" | jq -r '.authenticated_authorize')" = 'false'
          test "$(printf '%s' "${result}" | jq -r '.service_role_enqueue_daily')" = 'true'
          test "$(printf '%s' "${result}" | jq -r '.service_role_enqueue_weekly')" = 'true'
          test "$(printf '%s' "${result}" | jq -r '.service_role_claim')" = 'true'
          test "$(printf '%s' "${result}" | jq -r '.service_role_authorize')" = 'true'
          test "$(printf '%s' "${result}" | jq -r '.reminder_rpc_security_definer')" = 'true'
          test "$(printf '%s' "${result}" | jq -r '.authorize_rpc_security_definer')" = 'true'

      - name: Verify timezone validation in a rollback-only production transaction
        shell: bash
        run: |
          set -euo pipefail
          read -r -d '' QUERY <<'SQL' || true
          begin;
          do $$
          declare
            v_user uuid;
          begin
            select p.user_id
            into v_user
            from public.profiles p
            join auth.users u on u.id = p.user_id
            where p.is_suspended = false
            order by p.user_id
            limit 1;

            if v_user is not null then
              perform set_config('request.jwt.claim.sub', v_user::text, true);
              begin
                perform public.set_daily_reminder_preference(
                  true,
                  '09:00'::time,
                  'Deedlight/Definitely-Not-A-Timezone'
                );
                raise exception 'Invalid timezone was unexpectedly accepted.';
              exception
                when sqlstate '22023' then
                  null;
              end;
            end if;
          end;
          $$;
          rollback;
          SQL
          payload="$(jq -n --arg query "${QUERY}" '{query:$query}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_LANDING_AUDIT_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "${payload}")"
          printf '%s\n' "${response}" | jq .
