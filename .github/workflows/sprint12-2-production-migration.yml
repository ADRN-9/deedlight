name: Sprint 12.2 Production Migration

on:
  push:
    branches: [sprint-12-2-gentle-delivery-foundation]
    paths:
      - .github/workflows/sprint12-2-production-migration.yml

permissions:
  contents: read

jobs:
  production_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_LANDING_AUDIT_TOKEN: ${{ secrets.SUPABASE_LANDING_AUDIT_TOKEN }}
      SUPABASE_PROJECT_REF: xaipiovflxomcbfwtwmu
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: sprint-12-2-gentle-delivery-foundation
          fetch-depth: 0

      - name: Fail closed on target and scoped credential
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'sprint-12-2-gentle-delivery-foundation'
          test -n "${SUPABASE_LANDING_AUDIT_TOKEN:-}"
          test "${SUPABASE_PROJECT_REF}" = 'xaipiovflxomcbfwtwmu'
          test -f supabase/migrations/202609230019_sprint12_2_gentle_delivery_foundation.sql

      - name: Read production migration state
        shell: bash
        run: |
          set -euo pipefail

          read -r -d '' QUERY <<'SQL' || true
          select jsonb_build_object(
            'migration_table', to_regclass('supabase_migrations.schema_migrations') is not null,
            'migration_columns', (
              select jsonb_agg(
                jsonb_build_object(
                  'name', c.column_name,
                  'type', c.data_type,
                  'nullable', c.is_nullable
                ) order by c.ordinal_position
              )
              from information_schema.columns c
              where c.table_schema = 'supabase_migrations'
                and c.table_name = 'schema_migrations'
            ),
            'latest_migrations', (
              select jsonb_agg(x order by x.version desc)
              from (
                select version, name
                from supabase_migrations.schema_migrations
                order by version desc
                limit 8
              ) x
            ),
            'migration_018_present', exists (
              select 1
              from supabase_migrations.schema_migrations
              where version = '202608140018'
            ),
            'migration_019_present', exists (
              select 1
              from supabase_migrations.schema_migrations
              where version = '202609230019'
            ),
            'ledger_exists', to_regclass('public.delivery_ledger') is not null
          ) as result;
          SQL

          payload="$(jq -n --arg query "${QUERY}" '{query:$query}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_LANDING_AUDIT_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "${payload}")"

          printf '%s\n' "${response}" | jq .
          result="$(printf '%s\n' "${response}" | jq -c '.[0].result')"
          test "$(printf '%s' "${result}" | jq -r '.migration_table')" = 'true'
          test "$(printf '%s' "${result}" | jq -r '.migration_018_present')" = 'true'
