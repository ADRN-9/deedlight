name: Sprint 12.2 Production Migration

on:
  push:
    branches: [sprint-12-2-gentle-delivery-foundation]
    paths:
      - .github/workflows/sprint12-2-production-migration.yml

permissions:
  contents: read

jobs:
  production_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_LANDING_AUDIT_TOKEN: ${{ secrets.SUPABASE_LANDING_AUDIT_TOKEN }}
      SUPABASE_PROJECT_REF: xaipiovflxomcbfwtwmu
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: sprint-12-2-gentle-delivery-foundation
          fetch-depth: 0

      - name: Fail closed on target and scoped credential
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'sprint-12-2-gentle-delivery-foundation'
          test -n "${SUPABASE_LANDING_AUDIT_TOKEN:-}"
          test "${SUPABASE_PROJECT_REF}" = 'xaipiovflxomcbfwtwmu'
          test -f supabase/migrations/202609230019_sprint12_2_gentle_delivery_foundation.sql

      - name: Inspect production migration metadata
        shell: bash
        run: |
          set -euo pipefail

          read -r -d '' QUERY <<'SQL' || true
          select
            c.ordinal_position,
            c.column_name,
            c.data_type,
            c.is_nullable
          from information_schema.columns c
          where c.table_schema = 'supabase_migrations'
            and c.table_name = 'schema_migrations'
          order by c.ordinal_position;
          SQL

          payload="$(jq -n --arg query "${QUERY}" '{query:$query}')"
          raw="$(curl --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query/read-only" \
            --header "Authorization: Bearer ${SUPABASE_LANDING_AUDIT_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            --write-out $'\n%{http_code}')"

          status="${raw##*$'\n'}"
          body="${raw%$'\n'*}"
          printf 'HTTP %s\n' "${status}"
          printf '%s\n' "${body}" | jq . || printf '%s\n' "${body}"
          test "${status}" = '201'
