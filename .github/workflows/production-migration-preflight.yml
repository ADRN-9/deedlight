name: Production Migration Preflight

on:
  push:
    branches:
      - gentle-delivery-transport
    paths:
      - .github/workflows/production-migration-preflight.yml

permissions:
  contents: read

concurrency:
  group: deedlight-production-migration
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify production migration baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7

      - name: Guard required production secrets and project identity
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          if [[ "$SUPABASE_PROJECT_REF" != "xaipiovflxomcbfwtwmu" ]]; then
            echo "::error::SUPABASE_PROJECT_REF does not match the expected Deedlight production project"
            exit 1
          fi
          echo "Required secrets are present and the project ref matches the expected Deedlight production project."

      - name: Validate Supabase management token without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          account_status=$(curl --silent --show-error --output /tmp/supabase-projects.json --write-out '%{http_code}' \
            'https://api.supabase.com/v1/projects' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          if [[ "$account_status" != "200" ]]; then
            echo "::error::Supabase Management API token validation returned HTTP $account_status; response body intentionally not printed."
            exit 1
          fi

          project_status=$(curl --silent --show-error --output /tmp/supabase-project.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          if [[ "$project_status" != "200" ]]; then
            echo "::error::Production project access check returned HTTP $project_status; response body intentionally not printed."
            exit 1
          fi
          echo "Supabase Management API token is valid and can read the Deedlight production project."

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Record CLI version
        run: supabase --version

      - name: Link to production without schema mutation
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Record remote migration history state
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migration-list.txt
          if awk -F'│' '$2 ~ /[0-9]{12,14}/ { found=1 } END { exit(found ? 0 : 1) }' /tmp/migration-list.txt; then
            echo "Remote migration history contains recorded entries."
          else
            echo "Remote migration history is empty; schema verification will use the live database instead of db push."
          fi

      - name: Inspect live delivery schema read-only
        shell: bash
        run: |
          set -euo pipefail
          query=$(cat <<'SQL'
          select
            exists (
              select 1
              from pg_catalog.pg_class c
              join pg_catalog.pg_namespace n on n.oid = c.relnamespace
              where c.relname = 'delivery_ledger'
                and c.relkind in ('r','p')
            ) as has_delivery_ledger,
            (
              select count(distinct p.proname)
              from pg_catalog.pg_proc p
              join pg_catalog.pg_namespace n on n.oid = p.pronamespace
              where n.nspname = 'public'
                and p.proname = any(array[
                  'enqueue_due_daily_reminders',
                  'enqueue_weekly_goodness_delivery',
                  'claim_delivery_jobs',
                  'authorize_delivery_job',
                  'mark_delivery_sent',
                  'mark_delivery_failed'
                ]::text[])
            ) as foundation_functions,
            (
              select count(*)
              from information_schema.columns c
              where c.table_name = 'delivery_ledger'
                and c.column_name = any(array[
                  'claim_expires_at',
                  'attempt_count',
                  'last_attempt_at',
                  'next_attempt_at'
                ]::text[])
            ) as reliability_columns,
            (
              select count(*)
              from information_schema.columns c
              where c.table_name = 'delivery_ledger'
                and c.column_name = 'transport_started_at'
            ) as transport_columns,
            (
              select count(distinct p.proname)
              from pg_catalog.pg_proc p
              join pg_catalog.pg_namespace n on n.oid = p.pronamespace
              where n.nspname = 'public'
                and p.proname = any(array[
                  'begin_delivery_transport',
                  'enqueue_current_weekly_goodness_if_curated'
                ]::text[])
            ) as transport_functions;
          SQL
          )

          payload=$(jq -n --arg query "$query" '{query:$query}')
          status=$(curl --silent --show-error --output /tmp/live-schema.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload")

          if [[ "$status" != "201" ]]; then
            echo "::error::Read-only live-schema query returned HTTP $status; response body intentionally not printed."
            exit 1
          fi

          cat /tmp/live-schema.json
          jq -e '
            (if type == "array" then .[0] elif has("result") then .result[0] else . end) as $r
            | ($r.has_delivery_ledger == true)
              and (($r.foundation_functions | tonumber) == 6)
              and (($r.reliability_columns | tonumber) == 0)
              and (($r.transport_columns | tonumber) == 0)
              and (($r.transport_functions | tonumber) == 0)
          ' /tmp/live-schema.json >/dev/null || {
            echo "::error::Live Production schema does not match the expected migration-019 baseline with migrations 020/021 absent."
            exit 1
          }

          echo "Live Production schema confirms migration-019 delivery foundation is present and 020/021 delivery changes are absent."
          echo "No migration was applied."
