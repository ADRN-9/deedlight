name: Push Supabase migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    # Defense in depth only; the Environment branch policy is the primary credential boundary.
    if: github.ref == 'refs/heads/main' && github.ref_protected
    environment:
      name: production
    runs-on: ubuntu-latest
    concurrency:
      group: production-supabase-migrations
      cancel-in-progress: false
    steps:
      - name: Require protected main and configured Production environment
        shell: bash
        env:
          PRODUCTION_MIGRATION_ENVIRONMENT_GUARD: ${{ vars.PRODUCTION_MIGRATION_ENVIRONMENT_GUARD }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$PRODUCTION_MIGRATION_ENVIRONMENT_GUARD" = "production-environment-protected"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and push migrations
        run: |
          set -euo pipefail
          bash scripts/guard-supabase-migration-target.sh
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          bash scripts/guard-supabase-linked-project.sh
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
