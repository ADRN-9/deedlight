name: Production Runtime Identity Audit

on:
  push:
    branches: [production-canary]
    paths:
      - .github/workflows/production-runtime-identity-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_AUDIT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d2e826d7e5193ba8e9140533d1cc8a97
      WORKER_NAME: deedlight
    steps:
      - uses: actions/checkout@v7

      - name: Inspect non-secret Supabase runtime identity
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::Cloudflare audit token is missing"; exit 1; }

          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings"
          status=$(curl --silent --show-error --output /tmp/settings.json --write-out '%{http_code}' \
            "$url" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          [[ "$status" == "200" ]] || { echo "::error::Worker settings lookup returned HTTP $status"; exit 1; }
          jq -e '.success == true' /tmp/settings.json >/dev/null

          jq -c '[.result.bindings[] | select(.name == "SUPABASE_URL" or .name == "NEXT_PUBLIC_SUPABASE_URL") | {name,type,value:(if .type == "plain_text" then .text else "<redacted-secret>" end)}]' /tmp/settings.json
          jq -c '[.result.bindings[] | select(.name == "SUPABASE_SERVICE_ROLE_KEY" or .name == "NEXT_PUBLIC_SUPABASE_ANON_KEY") | {name,type,present:true}]' /tmp/settings.json
          rm -f /tmp/settings.json
