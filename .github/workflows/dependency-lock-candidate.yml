name: DeedLight dependency lock candidate

on:
  push:
    branches:
      - security/deedlight-deps-c165-candidate

permissions:
  contents: write

jobs:
  resolve:
    if: "!contains(github.event.head_commit.message, '[lockfile-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Resolve the candidate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install and verify dependency graph
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm ls glob minimatch typescript-eslint --all
      - name: Commit generated lockfile to the isolated candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): generate patched lockfile [lockfile-generated]"
            git push origin HEAD:security/deedlight-deps-c165-candidate
          fi
