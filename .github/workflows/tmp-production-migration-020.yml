name: Temporary production migration 020

on:
  push:
    branches:
      - delivery-reliability-hardening
    paths:
      - .github/workflows/tmp-production-migration-020.yml

permissions:
  contents: read

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          test "$missing" -eq 0
          test "${GITHUB_REF_NAME}" = "delivery-reliability-hardening"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prove expected production baseline
        shell: bash
        run: |
          set -euo pipefail
          query=$(cat <<'SQL'
          do $$
          begin
            if to_regclass('public.delivery_ledger') is null then
              raise exception 'Production is missing the Sprint 12.2 delivery ledger.';
            end if;

            if to_regprocedure('public.claim_delivery_jobs(timestamp with time zone,integer)') is null
               or to_regprocedure('public.authorize_delivery_job(uuid,uuid)') is null
               or to_regprocedure('public.mark_delivery_sent(uuid,uuid,text)') is null
               or to_regprocedure('public.mark_delivery_failed(uuid,uuid,text)') is null then
              raise exception 'Production is missing the complete Sprint 12.2 RPC baseline.';
            end if;

            if not exists (
              select 1
              from supabase_migrations.schema_migrations
              where version = '202609230019'
            ) then
              raise exception 'Production migration history does not contain 019.';
            end if;

            if exists (
              select 1
              from supabase_migrations.schema_migrations
              where version = '202609230020'
            ) then
              raise exception 'Migration 020 is already recorded as applied.';
            end if;

            if exists (
              select 1
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'delivery_ledger'
                and column_name in ('claim_expires_at', 'attempt_count', 'last_attempt_at', 'next_attempt_at')
            )
            or to_regprocedure('public.retry_delivery_job(uuid,uuid,timestamp with time zone,text)') is not null then
              raise exception 'Production appears partially migrated to delivery reliability hardening.';
            end if;

            if exists (
              select 1
              from public.delivery_ledger
              where state = 'claimed'
            ) then
              raise exception 'Production has live claimed delivery jobs; refusing migration.';
            end if;
          end
          $$;
          SQL
          )
          jq -n --arg query "$query" '{query: $query}' > /tmp/baseline.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @/tmp/baseline.json \
            >/tmp/baseline-response.json

      - name: Link and preview exact pending migration
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list
          supabase db push --linked --dry-run

      - name: Apply pending migration 020
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --yes

      - name: Verify production reliability state
        shell: bash
        run: |
          set -euo pipefail
          query=$(cat <<'SQL'
          do $$
          begin
            if not exists (
              select 1
              from supabase_migrations.schema_migrations
              where version = '202609230020'
            ) then
              raise exception 'Migration 020 is not recorded in production history.';
            end if;

            if (
              select count(*)
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'delivery_ledger'
                and column_name in ('claim_expires_at', 'attempt_count', 'last_attempt_at', 'next_attempt_at')
            ) <> 4 then
              raise exception 'Production reliability columns are incomplete.';
            end if;

            if to_regprocedure('public.retry_delivery_job(uuid,uuid,timestamp with time zone,text)') is null then
              raise exception 'Production retry_delivery_job RPC is missing.';
            end if;

            if has_function_privilege('anon', 'public.retry_delivery_job(uuid,uuid,timestamp with time zone,text)', 'EXECUTE')
               or has_function_privilege('authenticated', 'public.retry_delivery_job(uuid,uuid,timestamp with time zone,text)', 'EXECUTE') then
              raise exception 'Browser roles can execute retry_delivery_job.';
            end if;

            if not has_function_privilege('service_role', 'public.retry_delivery_job(uuid,uuid,timestamp with time zone,text)', 'EXECUTE')
               or not has_function_privilege('service_role', 'public.claim_delivery_jobs(timestamp with time zone,integer)', 'EXECUTE')
               or not has_function_privilege('service_role', 'public.authorize_delivery_job(uuid,uuid)', 'EXECUTE')
               or not has_function_privilege('service_role', 'public.mark_delivery_sent(uuid,uuid,text)', 'EXECUTE')
               or not has_function_privilege('service_role', 'public.mark_delivery_failed(uuid,uuid,text)', 'EXECUTE') then
              raise exception 'Service-role delivery execution privileges are incomplete.';
            end if;

            if has_table_privilege('anon', 'public.delivery_ledger', 'SELECT')
               or has_table_privilege('authenticated', 'public.delivery_ledger', 'SELECT')
               or has_table_privilege('anon', 'public.delivery_ledger', 'INSERT')
               or has_table_privilege('authenticated', 'public.delivery_ledger', 'INSERT')
               or has_table_privilege('anon', 'public.delivery_ledger', 'UPDATE')
               or has_table_privilege('authenticated', 'public.delivery_ledger', 'UPDATE')
               or has_table_privilege('anon', 'public.delivery_ledger', 'DELETE')
               or has_table_privilege('authenticated', 'public.delivery_ledger', 'DELETE') then
              raise exception 'Browser roles gained direct delivery_ledger privileges.';
            end if;

            if not exists (
              select 1
              from pg_constraint
              where conrelid = 'public.delivery_ledger'::regclass
                and conname = 'delivery_ledger_attempt_count_check'
            )
            or not exists (
              select 1
              from pg_constraint
              where conrelid = 'public.delivery_ledger'::regclass
                and conname = 'delivery_ledger_claim_lease_check'
            ) then
              raise exception 'Production reliability constraints are incomplete.';
            end if;
          end
          $$;
          SQL
          )
          jq -n --arg query "$query" '{query: $query}' > /tmp/verify.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @/tmp/verify.json \
            >/tmp/verify-response.json
          echo 'Production migration 020 verified.'
