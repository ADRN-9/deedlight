name: Production Canary Endpoint Validation

on:
  push:
    branches:
      - production-delivery-canary-endpoint

permissions:
  contents: read

jobs:
  validate-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
      DELIVERY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Diff integrity
        run: git diff --check
      - name: Canary safety assertions
        run: node scripts/verify-production-delivery-canary.mjs
      - name: Existing transport safety assertions
        run: node scripts/verify-gentle-delivery-transport.mjs
      - name: Existing transport behavior
        run: node --test scripts/test-delivery-transport.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
      - name: Cloudflare packaging build
        run: npx opennextjs-cloudflare build
