name: Cloudflare Post-Merge Audit

on:
  push:
    branches:
      - delivery-reliability-hardening
    paths:
      - .github/workflows/cloudflare-post-merge-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: Verify production Worker after PR4 merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_AUDIT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Guard audit token
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::CLOUDFLARE_BUILDS_AUDIT_TOKEN is missing"; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Read production deployment and secret names
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --name deedlight --json > /tmp/deployments.json
          npx wrangler secret list --name deedlight --format json > /tmp/secrets.json
          jq -e 'type == "array" and length > 0' /tmp/deployments.json >/dev/null
          echo "Latest deployment:"
          jq '.[-1]' /tmp/deployments.json
          echo "Worker secret names only:"
          jq '[.[] | {name, type}]' /tmp/secrets.json
          jq -e 'map(.name) | index("SUPABASE_SERVICE_ROLE_KEY") != null and index("RESEND_API_KEY") != null' /tmp/secrets.json >/dev/null || {
            echo "::error::Expected production runtime secrets are not both present"
            exit 1
          }
