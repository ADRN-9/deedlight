name: Cloudflare Post-Merge Audit

on:
  push:
    branches: [sprint-12-1-offering-ownership-engagement]
    paths:
      - .github/workflows/cloudflare-post-merge-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_AUDIT_TOKEN }}
      EXPECTED_WORKER: deedlight
      EXPECTED_PRODUCTION_BRANCH: main
      EXPECTED_COMMIT: 85ead3ea13c14752e840a1823c591adfb0c9d724
    steps:
      - name: Verify Cloudflare native production build with GET only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_AUDIT_TOKEN:-}"
          test "${GITHUB_REF_NAME}" = "sprint-12-1-offering-ownership-engagement"

          cf_get() {
            local url="$1"
            case "$url" in
              https://api.cloudflare.com/client/v4/*) ;;
              *) echo "Refusing non-Cloudflare API URL" >&2; exit 90 ;;
            esac
            curl --fail-with-body --silent --show-error \
              --request GET \
              --header "Authorization: Bearer ${CF_AUDIT_TOKEN}" \
              --header "Content-Type: application/json" \
              "$url"
          }

          accounts_json="$(cf_get 'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
          jq -e '.success == true' <<<"$accounts_json" >/dev/null
          account_count="$(jq '.result | length' <<<"$accounts_json")"
          test "$account_count" -eq 1
          account_id="$(jq -r '.result[0].id // empty' <<<"$accounts_json")"
          test -n "$account_id"

          api="https://api.cloudflare.com/client/v4/accounts/${account_id}"
          scripts_json="$(cf_get "${api}/workers/scripts")"
          jq -e '.success == true' <<<"$scripts_json" >/dev/null
          worker_tag="$(jq -r --arg worker "$EXPECTED_WORKER" '.result[] | select(.id == $worker) | (.tag // .external_script_id // empty)' <<<"$scripts_json")"
          test -n "$worker_tag"

          found=0
          for attempt in $(seq 1 24); do
            builds_json="$(cf_get "${api}/builds/workers/${worker_tag}/builds?per_page=50")"
            jq -e '.success == true' <<<"$builds_json" >/dev/null
            match_count="$(jq --arg branch "$EXPECTED_PRODUCTION_BRANCH" --arg commit "$EXPECTED_COMMIT" '[.result[]? | select(.build_trigger_metadata.branch == $branch and .build_trigger_metadata.commit_hash == $commit)] | length' <<<"$builds_json")"
            if [ "$match_count" -gt 0 ]; then
              found=1
              outcome="$(jq -r --arg branch "$EXPECTED_PRODUCTION_BRANCH" --arg commit "$EXPECTED_COMMIT" '[.result[]? | select(.build_trigger_metadata.branch == $branch and .build_trigger_metadata.commit_hash == $commit)][0].build_outcome // "pending"' <<<"$builds_json")"
              echo "CLOUDFLARE_MAIN_BUILD_OUTCOME=${outcome}"
              if [ "$outcome" = "success" ]; then
                exit 0
              fi
              if [ "$outcome" = "failure" ] || [ "$outcome" = "failed" ] || [ "$outcome" = "canceled" ] || [ "$outcome" = "cancelled" ]; then
                echo "Cloudflare native production build failed closed with outcome ${outcome}." >&2
                exit 95
              fi
            fi
            sleep 15
          done

          if [ "$found" -eq 0 ]; then
            echo "No Cloudflare native main build found for ${EXPECTED_COMMIT}; failing closed." >&2
          else
            echo "Cloudflare native main build did not reach success before timeout; failing closed." >&2
          fi
          exit 96
