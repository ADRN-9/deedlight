name: C524 dependency lock refresh
on:
  push:
    branches:
      - security/resend-webhook-destination-identity-c507
permissions:
  contents: write
concurrency:
  group: c524-lock-refresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'C524_LOCK_REFRESH_SHA=%s\n' "$GITHUB_SHA"
      - name: Refresh only affected dependency paths
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update --package-lock-only typescript-eslint --ignore-scripts --no-audit --no-fund
          npm audit --json > c524-npm-audit.json || test -s c524-npm-audit.json
          node -e 'const a=require("./c524-npm-audit.json"); const n=a.metadata?.vulnerabilities?.total; if(n!==0) { console.error("npm audit vulnerability total:",n); process.exit(1); } console.log("npm audit: zero vulnerabilities");'
          git diff --exit-code -- package.json
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): refresh lockfile for patched dependency paths"
            git push origin HEAD:refs/heads/security/resend-webhook-destination-identity-c507
          fi
      - name: Install locked dependencies for isolation verification
        run: npm ci --ignore-scripts
      - name: Probe kernel network namespace and run webhook regressions
        shell: bash
        run: |
          set -euo pipefail
          if sudo unshare --net --mount-proc -- true 2> c524-netns-probe.err; then
            echo "OS_NETWORK_NAMESPACE=available" | tee c524-isolation-result.txt
            sudo unshare --net --mount-proc -- node -e '
              const net = require("node:net");
              const socket = net.connect({ host: "1.1.1.1", port: 443 });
              const timer = setTimeout(() => { socket.destroy(); console.error("network namespace probe timed out"); process.exit(2); }, 2000);
              socket.once("connect", () => { clearTimeout(timer); socket.destroy(); console.error("unexpected outbound TCP connection"); process.exit(1); });
              socket.once("error", (error) => {
                clearTimeout(timer);
                if (error.code === "ENETUNREACH" || error.code === "ENETDOWN") {
                  console.log("OS_EGRESS_PROBE=blocked:" + error.code);
                  process.exit(0);
                }
                console.error("unexpected network probe error:" + error.code);
                process.exit(1);
              });
            '
            echo "OS_NETWORK_NAMESPACE_EGRESS=blocked" | tee -a c524-isolation-result.txt
            sudo unshare --net --mount-proc -- node --test scripts/test-c73-webhook-isolation.mjs scripts/test-c516-webhook-route-instrumentation.mjs
            echo "OS_NETWORK_NAMESPACE_WEBHOOK_TESTS=pass" | tee -a c524-isolation-result.txt
          else
            echo "OS_NETWORK_NAMESPACE=unavailable" | tee c524-isolation-result.txt
            cat c524-netns-probe.err | tee -a c524-isolation-result.txt
            node --test scripts/test-c73-webhook-isolation.mjs scripts/test-c516-webhook-route-instrumentation.mjs
            echo "PROCESS_LOCAL_INTERCEPTION_WEBHOOK_TESTS=pass" | tee -a c524-isolation-result.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: c524-lock-refresh
          path: |
            package-lock.json
            c524-npm-audit.json
            c524-isolation-result.txt
            c524-netns-probe.err
          if-no-files-found: error
          retention-days: 3
