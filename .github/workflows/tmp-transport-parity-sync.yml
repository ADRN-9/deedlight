name: Temporary transport parity sync

on:
  push:
    branches:
      - gentle-delivery-transport
    paths:
      - .github/workflows/tmp-transport-parity-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gentle-delivery-transport

      - name: Append canonical migration when missing
        shell: bash
        run: |
          set -euo pipefail
          canonical='supabase/migrations/202609230021_gentle_delivery_transport.sql'
          aggregate='supabase/run_in_sql_editor_all.sql'
          marker='-- Gentle Delivery Transport — provider-idempotency boundary and weekly scheduler helper.'
          if ! grep -Fq -- "$marker" "$aggregate"; then
            printf '\n\n' >> "$aggregate"
            cat "$canonical" >> "$aggregate"
          fi
          tail -c 1 "$aggregate" | od -An -t u1 | grep -q '10' || printf '\n' >> "$aggregate"

      - name: Commit parity update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/run_in_sql_editor_all.sql; then
            echo 'Aggregate SQL already contains migration 021.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/run_in_sql_editor_all.sql
          git commit -m 'db: mirror gentle delivery transport migration'
          git push origin HEAD:gentle-delivery-transport
