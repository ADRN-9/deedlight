name: Cloudflare Builds Audit

on:
  push:
    branches: [sprint-12-1-offering-ownership-engagement]
    paths:
      - .github/workflows/cloudflare-builds-audit.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-builds-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_AUDIT_TOKEN }}
      EXPECTED_WORKER: deedlight
      EXPECTED_REPO: deedlight
      EXPECTED_PRODUCTION_BRANCH: main
    steps:
      - name: Fail closed before Cloudflare audit
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "sprint-12-1-offering-ownership-engagement"
          test -n "${CF_ACCOUNT_ID:-}"
          test -n "${CF_AUDIT_TOKEN:-}"
          test "${EXPECTED_PRODUCTION_BRANCH}" = "main"

      - name: Audit Cloudflare Workers Builds configuration with GET only
        shell: bash
        run: |
          set -euo pipefail

          cf_get() {
            local url="$1"
            case "$url" in
              https://api.cloudflare.com/client/v4/*) ;;
              *) echo "Refusing non-Cloudflare API URL" >&2; exit 90 ;;
            esac
            curl --fail-with-body --silent --show-error \
              --request GET \
              --header "Authorization: Bearer ${CF_AUDIT_TOKEN}" \
              --header "Content-Type: application/json" \
              "$url"
          }

          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"

          scripts_json="$(cf_get "${api}/workers/scripts")"
          jq -e '.success == true' <<<"$scripts_json" >/dev/null

          worker_count="$(jq --arg worker "$EXPECTED_WORKER" '[.result[] | select(.id == $worker)] | length' <<<"$scripts_json")"
          if [ "$worker_count" -ne 1 ]; then
            echo "Expected exactly one Worker named ${EXPECTED_WORKER}; found ${worker_count}. Failing closed." >&2
            jq --arg worker "$EXPECTED_WORKER" '{available_worker_names: [.result[]?.id], expected: $worker}' <<<"$scripts_json"
            exit 91
          fi

          worker_tag="$(jq -r --arg worker "$EXPECTED_WORKER" '.result[] | select(.id == $worker) | (.tag // .external_script_id // empty)' <<<"$scripts_json")"
          if [ -z "$worker_tag" ]; then
            echo "Worker tag missing for ${EXPECTED_WORKER}; refusing to guess." >&2
            exit 92
          fi

          echo '--- Cloudflare Worker identity (sanitized) ---'
          jq --arg worker "$EXPECTED_WORKER" '{worker: [.result[] | select(.id == $worker) | {id, tag: (.tag // .external_script_id // null), created_on, modified_on}]}' <<<"$scripts_json"

          triggers_json="$(cf_get "${api}/builds/workers/${worker_tag}/triggers")"
          jq -e '.success == true' <<<"$triggers_json" >/dev/null

          echo '--- Workers Builds triggers (sanitized; no variables/tokens) ---'
          jq '{triggers: [.result[]? | {
            trigger_uuid,
            trigger_name,
            external_script_id,
            build_command,
            deploy_command,
            root_directory,
            branch_includes,
            branch_excludes,
            path_includes,
            path_excludes,
            build_caching_enabled,
            created_on,
            modified_on,
            repo_connection: (if .repo_connection then {
              provider_type: .repo_connection.provider_type,
              provider_account_name: .repo_connection.provider_account_name,
              repo_id: .repo_connection.repo_id,
              repo_name: .repo_connection.repo_name,
              created_on: .repo_connection.created_on,
              modified_on: .repo_connection.modified_on
            } else null end)
          }]}' <<<"$triggers_json"

          trigger_count="$(jq '.result | length' <<<"$triggers_json")"
          main_trigger_count="$(jq --arg branch "$EXPECTED_PRODUCTION_BRANCH" '[.result[]? | select((.branch_includes // []) | index($branch))] | length' <<<"$triggers_json")"
          repo_match_count="$(jq --arg repo "$EXPECTED_REPO" '[.result[]? | select((.repo_connection.repo_name // "") | (endswith("/" + $repo) or . == $repo))] | length' <<<"$triggers_json")"

          echo "AUDIT_TRIGGER_COUNT=${trigger_count}"
          echo "AUDIT_MAIN_TRIGGER_COUNT=${main_trigger_count}"
          echo "AUDIT_REPO_MATCH_COUNT=${repo_match_count}"

          builds_json="$(cf_get "${api}/builds/workers/${worker_tag}/builds?per_page=10")"
          jq -e '.success == true' <<<"$builds_json" >/dev/null

          echo '--- Recent Workers Builds (sanitized; no variables/tokens/author identity) ---'
          jq '{builds: [.result[]? | {
            build_uuid,
            build_outcome,
            created_on,
            modified_on,
            build_trigger_metadata: (if .build_trigger_metadata then {
              branch: .build_trigger_metadata.branch,
              commit_hash: .build_trigger_metadata.commit_hash,
              commit_message: .build_trigger_metadata.commit_message,
              build_trigger_source: .build_trigger_metadata.build_trigger_source,
              build_command: .build_trigger_metadata.build_command,
              deploy_command: .build_trigger_metadata.deploy_command,
              provider_type: .build_trigger_metadata.provider_type,
              repo_name: .build_trigger_metadata.repo_name
            } else null end)
          }]}' <<<"$builds_json"

          echo 'Cloudflare audit completed using GET requests only.'
