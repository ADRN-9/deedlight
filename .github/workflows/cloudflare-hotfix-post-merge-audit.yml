name: Cloudflare Hotfix Post-Merge Audit

on:
  push:
    branches: [hotfix-cloudflare-native-deploy-only]
    paths:
      - .github/workflows/cloudflare-hotfix-post-merge-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_AUDIT_TOKEN }}
      EXPECTED_WORKER: deedlight
      EXPECTED_COMMIT: 1efa8d095cc350a75df22e30892cd1305dda5fa5
    steps:
      - name: Verify Cloudflare native main build with GET only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_AUDIT_TOKEN:-}"
          test "${GITHUB_REF_NAME}" = "hotfix-cloudflare-native-deploy-only"

          cf_get() {
            local url="$1"
            case "$url" in https://api.cloudflare.com/client/v4/*) ;; *) exit 90 ;; esac
            curl --fail-with-body --silent --show-error --request GET \
              --header "Authorization: Bearer ${CF_AUDIT_TOKEN}" \
              --header "Content-Type: application/json" "$url"
          }

          accounts_json="$(cf_get 'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
          test "$(jq '.result | length' <<<"$accounts_json")" -eq 1
          account_id="$(jq -r '.result[0].id // empty' <<<"$accounts_json")"
          test -n "$account_id"
          api="https://api.cloudflare.com/client/v4/accounts/${account_id}"
          scripts_json="$(cf_get "${api}/workers/scripts")"
          worker_tag="$(jq -r --arg worker "$EXPECTED_WORKER" '.result[] | select(.id == $worker) | (.tag // .external_script_id // empty)' <<<"$scripts_json")"
          test -n "$worker_tag"

          for attempt in $(seq 1 24); do
            builds_json="$(cf_get "${api}/builds/workers/${worker_tag}/builds?per_page=50")"
            outcome="$(jq -r --arg commit "$EXPECTED_COMMIT" '[.result[]? | select(.build_trigger_metadata.branch == "main" and .build_trigger_metadata.commit_hash == $commit)][0].build_outcome // "missing"' <<<"$builds_json")"
            echo "CLOUDFLARE_HOTFIX_MAIN_BUILD_OUTCOME=${outcome}"
            if [ "$outcome" = "success" ]; then exit 0; fi
            if [ "$outcome" = "failure" ] || [ "$outcome" = "failed" ] || [ "$outcome" = "canceled" ] || [ "$outcome" = "cancelled" ]; then exit 95; fi
            sleep 15
          done
          exit 96
