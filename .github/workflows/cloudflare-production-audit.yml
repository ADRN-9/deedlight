name: Cloudflare Production Audit

on:
  push:
    branches:
      - gentle-delivery-transport
    paths:
      - .github/workflows/cloudflare-production-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: Audit Deedlight production Worker read-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_AUDIT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Guard audit token
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::CLOUDFLARE_BUILDS_AUDIT_TOKEN is missing"; exit 1; }
      - name: Verify Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/cf-token.json --write-out '%{http_code}' \
            'https://api.cloudflare.com/client/v4/user/tokens/verify' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          [[ "$status" == "200" ]] || { echo "::error::Cloudflare token verification returned HTTP $status"; exit 1; }
          jq -e '.success == true and .result.status == "active"' /tmp/cf-token.json >/dev/null || { echo "::error::Cloudflare token is not active"; exit 1; }
          echo "Cloudflare audit token is active."
      - name: Install dependencies
        run: npm ci
      - name: Audit authenticated Worker access
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler whoami
          npx wrangler versions list --name deedlight --json > /tmp/versions.json
          npx wrangler deployments list --name deedlight --json > /tmp/deployments.json
          npx wrangler secret list --name deedlight --format json > /tmp/secrets.json
          jq -e 'type == "array" and length > 0' /tmp/versions.json >/dev/null || { echo "::error::No deedlight Worker versions visible to audit token"; exit 1; }
          jq -e 'type == "array" and length > 0' /tmp/deployments.json >/dev/null || { echo "::error::No deedlight Worker deployments visible to audit token"; exit 1; }
          echo "Recent Worker versions:"
          jq '[.[] | {id, created_on, source, tag, message}]' /tmp/versions.json
          echo "Recent Worker deployments:"
          jq '[.[] | {id, created_on, source, versions}]' /tmp/deployments.json
          echo "Worker secret names only:"
          jq '[.[] | {name, type}]' /tmp/secrets.json
