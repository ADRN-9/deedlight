name: Production Auth Config Audit

on:
  push:
    branches:
      - production-canary
    paths:
      - .github/workflows/production-auth-config-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: Audit safe Production Auth mail settings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Guard Production identity
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || { echo "::error::SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" == "xaipiovflxomcbfwtwmu" ]] || { echo "::error::Unexpected Supabase Production project"; exit 1; }

      - name: Read and reduce Auth config to non-secret diagnostics
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/auth-config.json --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          [[ "$status" == "200" ]] || { echo "::error::Auth config lookup returned HTTP $status"; exit 1; }

          jq '{
            disable_signup,
            external_email_enabled,
            mailer_autoconfirm,
            mailer_allow_unverified_email_sign_ins,
            hook_send_email_enabled,
            site_url,
            uri_allow_list,
            smtp_configured: ((.smtp_host // "") != "" and (.smtp_port // "") != "" and (.smtp_admin_email // "") != ""),
            smtp_credentials_configured: ((.smtp_user // "") != "" and (.smtp_pass // "") != ""),
            smtp_sender_name_configured: ((.smtp_sender_name // "") != ""),
            smtp_max_frequency,
            rate_limit_email_sent,
            rate_limit_otp,
            mailer_otp_exp,
            mailer_otp_length
          }' /tmp/auth-config.json

          jq -e '.external_email_enabled == true and .disable_signup == false' /tmp/auth-config.json >/dev/null || {
            echo "::error::Production Auth is not configured to permit normal email signup"
            exit 1
          }
          rm -f /tmp/auth-config.json
