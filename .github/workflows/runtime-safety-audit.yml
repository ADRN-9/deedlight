name: Runtime Safety Audit

on:
  push:
    branches:
      - post-land-validation
    paths:
      - .github/workflows/runtime-safety-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: Verify delivery remains disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_AUDIT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d2e826d7e5193ba8e9140533d1cc8a97
      WORKER_NAME: deedlight
    steps:
      - name: Guard audit token
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::CLOUDFLARE_BUILDS_AUDIT_TOKEN is missing"; exit 1; }

      - name: Verify no Cron triggers
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/schedules"
          status=$(curl --silent --show-error --output /tmp/schedules.json --write-out '%{http_code}' \
            "$url" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          [[ "$status" == "200" ]] || { echo "::error::Cron schedule audit returned HTTP $status"; exit 1; }
          jq -e '.success == true and (.result.schedules | type == "array") and (.result.schedules | length == 0)' /tmp/schedules.json >/dev/null || {
            echo "::error::Production Worker has one or more Cron triggers"
            exit 1
          }
          echo "Production Cron trigger count: 0"

      - name: Verify delivery kill switch and secret bindings
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings"
          status=$(curl --silent --show-error --output /tmp/settings.json --write-out '%{http_code}' \
            "$url" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          [[ "$status" == "200" ]] || { echo "::error::Worker settings audit returned HTTP $status"; exit 1; }

          jq -e '.success == true' /tmp/settings.json >/dev/null || { echo "::error::Cloudflare settings response was not successful"; exit 1; }
          jq -e '([.result.bindings[] | select(.name == "DELIVERY_ENABLED" and .type == "plain_text" and .text == "false")] | length) == 1' /tmp/settings.json >/dev/null || {
            echo "::error::DELIVERY_ENABLED is not exactly false in Production runtime settings"
            exit 1
          }
          jq -e '([.result.bindings[] | select(.name == "RESEND_API_KEY" and .type == "secret_text")] | length) == 1' /tmp/settings.json >/dev/null || {
            echo "::error::RESEND_API_KEY secret binding is missing"
            exit 1
          }
          jq -e '([.result.bindings[] | select(.name == "SUPABASE_SERVICE_ROLE_KEY" and .type == "secret_text")] | length) == 1' /tmp/settings.json >/dev/null || {
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret binding is missing"
            exit 1
          }
          echo "DELIVERY_ENABLED=false; expected secret bindings are present. Secret values were not printed."
