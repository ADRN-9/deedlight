name: Production Canary Confirmation

on:
  push:
    branches:
      - production-canary
    paths:
      - .github/workflows/production-canary-confirmation.yml

permissions:
  contents: read

jobs:
  audit:
    name: Audit Production delivery canary prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_AUDIT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d2e826d7e5193ba8e9140533d1cc8a97
      WORKER_NAME: deedlight
    steps:
      - uses: actions/checkout@v7

      - name: Guard audit credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::CLOUDFLARE_BUILDS_AUDIT_TOKEN is missing"; exit 1; }

      - name: Verify delivery runtime bindings without printing values
        shell: bash
        run: |
          set -euo pipefail
          settings_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings"
          status=$(curl --silent --show-error --output /tmp/settings.json --write-out '%{http_code}' \
            "$settings_url" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          [[ "$status" == "200" ]] || { echo "::error::Worker settings lookup returned HTTP $status"; exit 1; }
          jq -e '.success == true' /tmp/settings.json >/dev/null || { echo "::error::Cloudflare settings response failed"; exit 1; }

          jq -e '
            [.result.bindings[] | select(.name == "DELIVERY_ENABLED" and .type == "plain_text" and .text == "false")] | length == 1
          ' /tmp/settings.json >/dev/null || { echo "::error::DELIVERY_ENABLED is not exactly false"; exit 1; }
          jq -e '
            [.result.bindings[] | select(.name == "DELIVERY_PROVIDER" and .type == "plain_text" and .text == "resend")] | length == 1
          ' /tmp/settings.json >/dev/null || { echo "::error::DELIVERY_PROVIDER is not resend"; exit 1; }
          jq -e '
            [.result.bindings[] | select(.name == "SUPABASE_URL" and .type == "plain_text" and .text == "https://xaipiovflxomcbfwtwmu.supabase.co")] | length == 1
          ' /tmp/settings.json >/dev/null || { echo "::error::SUPABASE_URL is unexpected"; exit 1; }
          jq -e '
            [.result.bindings[] | select(.name == "SUPABASE_SERVICE_ROLE_KEY" and .type == "secret_text")] | length == 1
          ' /tmp/settings.json >/dev/null || { echo "::error::SUPABASE_SERVICE_ROLE_KEY secret binding is missing"; exit 1; }
          jq -e '
            [.result.bindings[] | select(.name == "RESEND_API_KEY" and .type == "secret_text")] | length == 1
          ' /tmp/settings.json >/dev/null || { echo "::error::RESEND_API_KEY secret binding is missing"; exit 1; }
          jq -e '
            [.result.bindings[] | select(.name == "DELIVERY_FROM_EMAIL" and .type == "plain_text" and (.text | length) > 3 and (.text | contains("@")))] | length == 1
          ' /tmp/settings.json >/dev/null || { echo "::error::DELIVERY_FROM_EMAIL binding is missing or malformed"; exit 1; }
          jq -e '
            [.result.bindings[] | select(.name == "NEXT_PUBLIC_SITE_URL" and .type == "plain_text" and .text == "https://deedlight.com")] | length == 1
          ' /tmp/settings.json >/dev/null || { echo "::error::NEXT_PUBLIC_SITE_URL is unexpected"; exit 1; }

          batch_count=$(jq '[.result.bindings[] | select(.name == "DELIVERY_BATCH_SIZE")] | length' /tmp/settings.json)
          if [[ "$batch_count" != "0" ]]; then
            jq -e '
              [.result.bindings[] | select(.name == "DELIVERY_BATCH_SIZE" and .type == "plain_text" and (.text | test("^[1-9][0-9]?$|^100$")))] | length == 1
            ' /tmp/settings.json >/dev/null || { echo "::error::DELIVERY_BATCH_SIZE is invalid"; exit 1; }
          fi
          rm -f /tmp/settings.json
          echo "Required delivery runtime bindings are present; delivery remains disabled."

      - name: Verify Production Cron triggers are still empty
        shell: bash
        run: |
          set -euo pipefail
          schedules_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/schedules"
          status=$(curl --silent --show-error --output /tmp/schedules.json --write-out '%{http_code}' \
            "$schedules_url" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          [[ "$status" == "200" ]] || { echo "::error::Worker schedules lookup returned HTTP $status"; exit 1; }
          jq -e '.success == true and ((.result.schedules // []) | length == 0)' /tmp/schedules.json >/dev/null || {
            echo "::error::Production has one or more active Cron triggers"
            exit 1
          }
          rm -f /tmp/schedules.json
          echo "Production Cron trigger count is zero."
