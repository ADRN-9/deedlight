name: Production Canary Build Audit

on:
  push:
    branches:
      - production-canary
    paths:
      - .github/workflows/production-canary-build-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_AUDIT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d2e826d7e5193ba8e9140533d1cc8a97
      WORKER_NAME: deedlight
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Worker tag and inspect latest builds
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::Cloudflare audit token is missing"; exit 1; }
          scripts_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          status=$(curl --silent --show-error --output /tmp/scripts.json --write-out '%{http_code}' \
            "$scripts_url" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          [[ "$status" == "200" ]] || { echo "::error::Workers list returned HTTP $status"; exit 1; }
          tag=$(jq -r --arg name "$WORKER_NAME" '[.result[] | select(.id == $name) | .tag][0] // empty' /tmp/scripts.json)
          [[ -n "$tag" ]] || { echo "::error::Worker tag not found"; exit 1; }
          echo "::add-mask::$tag"
          builds_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/workers/$tag/builds"
          status=$(curl --silent --show-error --output /tmp/builds.json --write-out '%{http_code}' \
            "$builds_url" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          [[ "$status" == "200" ]] || { echo "::error::Builds lookup returned HTTP $status"; exit 1; }
          jq -e '.success == true' /tmp/builds.json >/dev/null
          jq -c '
            (.result.builds // .result // [])[:5]
            | map({
                build_uuid,
                status: (.status // .build_outcome),
                branch: (.build_trigger_metadata.branch // .branch),
                commit_hash: (.build_trigger_metadata.commit_hash // .commit_hash),
                created_at,
                completed_at
              })
          ' /tmp/builds.json
          rm -f /tmp/scripts.json /tmp/builds.json
