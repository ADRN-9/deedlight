name: Sprint 12.1 Production Smoke

on:
  push:
    branches: [sprint-12-1-offering-ownership-engagement]
    paths:
      - .github/workflows/sprint12-1-production-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public production smoke
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "sprint-12-1-offering-ownership-engagement"

          base="https://deedlight.com"
          smoke_id="cc2cfb4d-dd6f-4180-b713-2d3a8a798b2d"

          health_code="$(curl --silent --show-error --location --output /tmp/health --write-out '%{http_code}' "${base}/api/health")"
          test "$health_code" = "200"

          offerings_code="$(curl --silent --show-error --location --output /tmp/offerings --write-out '%{http_code}' "${base}/offerings")"
          test "$offerings_code" = "200"

          category_code="$(curl --silent --show-error --location --output /tmp/category --write-out '%{http_code}' "${base}/offerings?type=quiet_goodness")"
          test "$category_code" = "200"

          detail_code="$(curl --silent --show-error --location --output /tmp/detail --write-out '%{http_code}' "${base}/offerings/${smoke_id}")"
          if [ "$detail_code" != "404" ]; then
            echo "Expected pending/restored smoke Offering to be unavailable publicly with 404; got ${detail_code}." >&2
            exit 91
          fi

          if grep -Fq 'Sprint 12.1 acceptance cc2cfb4d' /tmp/offerings /tmp/category /tmp/detail; then
            echo 'Smoke Offering leaked onto a public surface; failing closed.' >&2
            exit 92
          fi

          echo "PROD_HEALTH_HTTP=${health_code}"
          echo "PROD_OFFERINGS_HTTP=${offerings_code}"
          echo "PROD_CATEGORY_HTTP=${category_code}"
          echo "PROD_PENDING_DETAIL_HTTP=${detail_code}"
