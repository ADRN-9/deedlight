name: Sprint 12.1 Production Smoke

on:
  push:
    branches: [sprint-12-1-offering-ownership-engagement]
    paths:
      - .github/workflows/sprint12-1-production-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public production diagnostic smoke
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "sprint-12-1-offering-ownership-engagement"

          base="https://deedlight.com"
          smoke_id="cc2cfb4d-dd6f-4180-b713-2d3a8a798b2d"
          smoke_title="Sprint 12.1 acceptance cc2cfb4d"

          get_code() {
            local url="$1"
            local out="$2"
            curl --silent --show-error --location --max-time 20 --output "$out" --write-out '%{http_code}' "$url"
          }

          health_code="$(get_code "${base}/api/health" /tmp/health)"
          offerings_code="$(get_code "${base}/offerings" /tmp/offerings)"
          category_code="$(get_code "${base}/offerings?type=quiet_goodness" /tmp/category)"
          detail_code="$(get_code "${base}/offerings/${smoke_id}" /tmp/detail)"

          test "$health_code" = "200"
          test "$offerings_code" = "200"
          test "$category_code" = "200"

          marker() {
            local needle="$1"
            local file="$2"
            if grep -Fq "$needle" "$file"; then printf 'true'; else printf 'false'; fi
          }

          echo "PROD_HEALTH_HTTP=${health_code}"
          echo "PROD_OFFERINGS_HTTP=${offerings_code}"
          echo "PROD_CATEGORY_HTTP=${category_code}"
          echo "PROD_SMOKE_DETAIL_HTTP=${detail_code}"
          echo "SMOKE_TITLE_ON_DETAIL=$(marker "$smoke_title" /tmp/detail)"
          echo "SMOKE_TITLE_ON_OFFERINGS=$(marker "$smoke_title" /tmp/offerings)"
          echo "SMOKE_TITLE_ON_CATEGORY=$(marker "$smoke_title" /tmp/category)"
          echo "ANONYMOUS_LIGHT_ON_DETAIL=$(marker 'Anonymous Light' /tmp/detail)"
          echo "YOUR_OFFERING_ON_PUBLIC_DETAIL=$(marker 'Your Offering' /tmp/detail)"

          if grep -Fq 'Your Offering' /tmp/detail; then
            echo 'Owner-only marker appeared in anonymous public response; failing closed.' >&2
            exit 92
          fi
