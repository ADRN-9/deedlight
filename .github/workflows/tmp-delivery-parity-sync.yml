name: Temporary delivery parity sync

on:
  push:
    branches: [delivery-reliability-hardening]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: delivery-reliability-hardening

      - name: Append canonical migration when missing
        run: node scripts/sync-delivery-reliability-parity.mjs

      - name: Commit parity update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/run_in_sql_editor_all.sql; then
            echo "Aggregate SQL already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/run_in_sql_editor_all.sql
          git commit -m "db: mirror delivery reliability migration"
          git push origin HEAD:delivery-reliability-hardening
