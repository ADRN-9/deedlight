name: C73 integrated provider security disposable rehearsal
on:
  push:
    branches:
      - evidence/deedlight-c73-integrated-security-d8700788-v1
    paths:
      - evidence/deedlight-c73-integrated-security-d8700788/patch/C73_OVERLAY_ONLY.patch
      - .github/workflows/c73-security-rehearsal.yml
permissions:
  contents: read
concurrency:
  group: c73-integrated-security
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DELIVERY_ENABLED: "false"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      CI: "true"
    steps:
      - name: Refuse Production configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$DELIVERY_ENABLED" = false
          for name in DATABASE_URL SUPABASE_URL SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY RESEND_WEBHOOK_SECRET; do
            test -z "$(printenv "$name" || true)"
          done
      - name: Evidence-only branch
        uses: actions/checkout@v7
        with:
          path: evidence
          persist-credentials: false
      - name: Immutable PR10 source
        uses: actions/checkout@v7
        with:
          ref: c983e2ed8b93c935139c935343261570ecea6978
          path: app
          persist-credentials: false
      - name: Cycle72 proven patch source
        uses: actions/checkout@v7
        with:
          ref: fd12decb00d82658eaeea929171190c3be53883d
          path: c72
          persist-credentials: false
      - name: Authentic 025-028 source
        uses: actions/checkout@v7
        with:
          ref: f4bffa2d24f5241012b99f673eaaa39ac1dc2907
          path: c68
          persist-credentials: false
      - name: Authentic C61 global registry source
        uses: actions/checkout@v7
        with:
          ref: 80fed7f0b3e07c3c9ee0cf0fdb0675559a54b9bd
          path: c61
          persist-credentials: false
      - name: Materialize and verify isolated integrated Git tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c73-test-results
          test "$(git -C app rev-parse HEAD)" = c983e2ed8b93c935139c935343261570ecea6978
          test "$(git -C c72 rev-parse HEAD)" = fd12decb00d82658eaeea929171190c3be53883d
          test "$(git -C c68 rev-parse HEAD)" = f4bffa2d24f5241012b99f673eaaa39ac1dc2907
          test "$(git -C c61 rev-parse HEAD)" = 80fed7f0b3e07c3c9ee0cf0fdb0675559a54b9bd
          p=c72/evidence/deedlight-c72-pr10-c70/results/C72_PR10_C70_INTEGRATION.patch
          echo "f1b77f2d339a939e996be7806d59f6885f7b2fd837130f8cc23436d26e6605ad  $p" | sha256sum --check
          git -C app apply --check "../$p"
          git -C app apply "../$p"
          git -C app add -- package.json package-lock.json scripts/test-gentle-delivery-transport.sql
          test "$(git -C app write-tree)" = d0a91a2d623b248d82588736c394fe252e0b7927
          src=c68/evidence/deedlight-c68-authentic-migrations-01f441aa
          (cd "$src" && sha256sum --strict --check SHA256SUMS.txt)
          cp "$src"/*.sql app/supabase/migrations/
          base64 -d c61/evidence/cycle61-provider-event-registry/ORIGINAL_C61_PACKAGE.zip.base64.txt > /tmp/c61original.zip
          echo "7e574ba3f8c455f30f5c18c1487fda45dcf5af1d4ae5f15f8ea4745724ea0630  /tmp/c61original.zip" | sha256sum --check
          mkdir /tmp/c61original
          unzip -q /tmp/c61original.zip -d /tmp/c61original
          cp /tmp/c61original/deedlight_c61_event_dedup_0871d1bf/patch/PROPOSED_POST_028_provider_event_registry.sql app/supabase/migrations/202611130029_global_provider_event_registry.sql
          echo "ed0dc53204c91b6171bc12de40929df6f54bae24e78716f0072d69593e008672  app/supabase/migrations/202611130029_global_provider_event_registry.sql" | sha256sum --check
          git -C app apply --check ../evidence/evidence/deedlight-c73-integrated-security-d8700788/patch/C73_OVERLAY_ONLY.patch
          git -C app apply ../evidence/evidence/deedlight-c73-integrated-security-d8700788/patch/C73_OVERLAY_ONLY.patch
          git -C app add -- .
          git -C app diff --cached --check
          git -C app write-tree | tee c73-test-results/verified-tree.txt
          test "$(cat c73-test-results/verified-tree.txt)" = 946c82ae3178a3e17bbcc7c43e80f4ee01efb6dd
          cp app/package.json app/package-lock.json c73-test-results/
          git -C app diff --cached --binary > c73-test-results/C73_COMPLETE_SOURCE.patch
          echo 'Cycle72 exact replay + C73 authentic source and overlay: PASS' | tee c73-test-results/source-integrity.txt
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Resolve verified Svix dependency
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --save-exact svix@2.10.0 --ignore-scripts > ../c73-test-results/npm-lock-resolution.log 2>&1
          node - <<'NODE'
          const p=require('./package.json'),l=require('./package-lock.json');
          if(p.dependencies.svix!=='2.10.0'||l.packages['node_modules/svix']?.version!=='2.10.0'
          ||p.devDependencies.wrangler!=='4.162.0'||p.overrides['source-map-js']!=='^1.2.2'
          ||!p.scripts['supabase:push'].includes('guard-supabase-linked-project.sh'))throw Error('Dependency security contract drift');
          console.log('C73 exact Svix and C72 dependency guard consistency: PASS');
          NODE
          cp package.json package-lock.json ../c73-test-results/
      - name: Install resolved dependency graph
        working-directory: app
        run: npm ci > ../c73-test-results/npm-ci.log 2>&1
      - name: Security verifiers, official Svix checks and delivery tests
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          for s in verify-sprint12-1-security.mjs verify-sprint12-2-delivery-security.mjs verify-delivery-reliability.mjs verify-gentle-delivery-transport.mjs verify-delivery-consent-gates.mjs verify-auth-pgcrypto-schema-qualification.mjs verify-c73-security.mjs; do
            node "scripts/$s" >> ../c73-test-results/security.log 2>&1
          done
          node --test scripts/test-delivery-transport.mjs scripts/test-c73-provider-webhook.mjs > ../c73-test-results/js-tests.log 2>&1
          echo 'Seven source security verifiers and both JS test suites: PASS'
      - name: Dependency audit high and critical
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --json > ../c73-test-results/npm-audit.json 2> ../c73-test-results/npm-audit.err
          set -e
          npm audit --audit-level=high > ../c73-test-results/npm-audit-high.log 2>&1
          node - <<'NODE'
          const a=require('../c73-test-results/npm-audit.json');
          if(!a.metadata?.vulnerabilities||a.metadata.vulnerabilities.high||a.metadata.vulnerabilities.critical)throw Error('High or critical dependency vulnerability');
          console.log(JSON.stringify(a.metadata.vulnerabilities));
          NODE
      - name: TypeScript
        working-directory: app
        run: npx tsc --noEmit > ../c73-test-results/typescript.log 2>&1
      - name: Next production build
        working-directory: app
        run: npm run build > ../c73-test-results/next-build.log 2>&1
      - name: Cloudflare packaging
        working-directory: app
        run: npx opennextjs-cloudflare build > ../c73-test-results/cloudflare-package.log 2>&1
      - name: PostgreSQL 16 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y postgresql-client
          psql -X -At -v ON_ERROR_STOP=1 -d postgres -c 'show server_version;' | tee c73-test-results/postgres-version.txt
          createdb deedlight_c73_test
      - name: PostgreSQL authentic 025-030 migration graph and security behavior
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d deedlight_c73_test -f scripts/test-c73-integrated-provider-security.sql > ../c73-test-results/postgres-integrated.log 2>&1
          grep -q '"c73_postgresql16_integrated_provider_security": "pass"' ../c73-test-results/postgres-integrated.log
          echo 'Authentic PostgreSQL 16 025-030 and negative fixtures: PASS'
      - name: Preserve complete isolated evidence with SHA256 manifest
        if: always()
        shell: bash
        run: |
          mkdir -p c73-test-results
          cd c73-test-results
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\n' | sort |
            while IFS= read -r f; do sha256sum "$f"; done > SHA256SUMS.txt
      - name: Upload evidence-only files, never deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deedlight-c73-integrated-security-disposable
          if-no-files-found: warn
          retention-days: 14
          path: c73-test-results/
