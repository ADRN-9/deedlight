name: C76 two-session kind isolation and consent regressions
on:
  push:
    branches:
      - evidence/deedlight-c76-provider-scheduler-ac39b069-v1
    paths:
      - .github/workflows/c76-kind-concurrency.yml
      - evidence/deedlight-c76-provider-scheduler/vectors/**
permissions:
  contents: read
jobs:
  concurrent_kind_postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DELIVERY_ENABLED: "false"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c983e2ed8b93c935139c935343261570ecea6978
          path: app
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: a25a43a85d74a5a5b9d05309ad0840df8ddcd8cf
          path: c73
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 4b913640c16c1113d9f559b26e7d930a432f4ccb
          path: c74
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: df1150dcee7c54a4e5bc2af1225afbc57c722309
          path: c75
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: evidence
          persist-credentials: false
      - name: Install PostgreSQL 16 client
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y postgresql-client
      - name: Replay exact C76 tree and verify parallel scoped workers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c76-kind-logs
          test "$DELIVERY_ENABLED" = false
          for key in DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD RESEND_API_KEY RESEND_WEBHOOK_SECRET CLOUDFLARE_API_TOKEN; do
            test -z "$(printenv "$key" || true)"
          done
          p73=c73/evidence/deedlight-c73-integrated-security-d8700788/results/C73_COMPLETE_RESOLVED_INTEGRATION.patch
          p74=c74/evidence/deedlight-c74-postgres-adversarial/results/pg/C74_POST_C73_CORRECTION.patch
          p75=c75/evidence/deedlight-c75-lifecycle/results/pg/C75_AFTER_C74_CORRECTION.patch
          p76=evidence/evidence/deedlight-c76-provider-scheduler/inputs/C76_AFTER_C75.patch
          printf '%s  %s\n' 864c3fae8df6b3c60fbcf17f0189e633ae1b1de54a01dde01738c545f53dc8d9 "$p73" | sha256sum --check
          printf '%s  %s\n' 71412f3345a34ba3e7ad1246cbfd0165b6d765fdbd719c97d045a6fae265a1fc "$p74" | sha256sum --check
          printf '%s  %s\n' 166c8834d48d3caaada8f766408a07b247a262ff5e042eb375be8bf5ae37484a "$p75" | sha256sum --check
          printf '%s  %s\n' 88c57e35489b4c7b5b806be02612dff67ef3ffd401cd884976e1d76982251672 "$p76" | sha256sum --check
          replay() {
            git -C app apply --check "../$1"
            git -C app apply "../$1"
            git -C app add -A
            test "$(git -C app write-tree)" = "$2"
          }
          replay "$p73" dd4f8593fdb1b3032eb6cddd5f39e50ea9cb7682
          replay "$p74" a9981c2672b316a07904ad7f6b498cd22f206a5b
          replay "$p75" 3ffedca10b5f38b375b08350ea7090e5a0a000d8
          replay "$p76" 5b9fa485c0dcc67beb5b82e9623e5dff4e93260b
          git -C app diff --cached --check
          git -C app write-tree > c76-kind-logs/source-tree.txt
          sha256sum evidence/evidence/deedlight-c76-provider-scheduler/vectors/c76-cross-kind-concurrency.sh > c76-kind-logs/script-sha256.txt
          bash -n evidence/evidence/deedlight-c76-provider-scheduler/vectors/c76-cross-kind-concurrency.sh
          psql -X -At -v ON_ERROR_STOP=1 -d postgres -c 'show server_version;' > c76-kind-logs/pg-server-version.txt
          createdb deedlight_c76_kinds
          cd app
          psql -X -v ON_ERROR_STOP=1 -d deedlight_c76_kinds -f scripts/test-c73-integrated-provider-security.sql > ../c76-kind-logs/019-030.log 2>&1
          psql -X -v ON_ERROR_STOP=1 -d deedlight_c76_kinds -f supabase/migrations/202611130031_c74_legacy_lifecycle_guard.sql > ../c76-kind-logs/031.log 2>&1
          psql -X -v ON_ERROR_STOP=1 -d deedlight_c76_kinds -f supabase/migrations/202611130032_c75_monotone_recipient_conflict_hold.sql > ../c76-kind-logs/032.log 2>&1
          psql -X -v ON_ERROR_STOP=1 -d deedlight_c76_kinds -f supabase/migrations/202611130033_c76_provider_classification_and_suppression.sql > ../c76-kind-logs/033.log 2>&1
          bash ../evidence/evidence/deedlight-c76-provider-scheduler/vectors/c76-cross-kind-concurrency.sh
          (cd ../c76-kind-logs && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\n' | sort | while IFS= read -r f; do sha256sum "$f"; done > SHA256SUMS.txt)
      - name: Retain immutable synthetic-only concurrency logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c76-kind-concurrent-postgres16
          path: c76-kind-logs/
          retention-days: 14
          if-no-files-found: warn
